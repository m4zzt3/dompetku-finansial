<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  [x-cloak] {
    display: none !important;
  }

  html, body {
    overflow-x: hidden;
    max-width: 100vw;
  }

  body {
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .font-mono-num {
    font-family: var(--font-mono);
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(156, 163, 175, 0.4);
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(156, 163, 175, 0.7);
  }

  /* Glassmorphism */
  .glass-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .dark .glass-card {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .glass-nav {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .dark .glass-nav {
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  /* Glow Effects */
  .glow-emerald {
    box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.25), 0 8px 10px -6px rgba(5, 150, 105, 0.2);
  }
  .glow-rose {
    box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.25), 0 8px 10px -6px rgba(225, 29, 72, 0.2);
  }
  .glow-blue {
    box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.25), 0 8px 10px -6px rgba(37, 99, 235, 0.2);
  }

  /* Micro-animation transitions */
  .transition-all-200 {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Hide Spinners for Number Input */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
  }

  /* Native date/time picker styling & color-scheme for dark mode */
  input[type="date"],
  input[type="time"] {
    position: relative;
    font-family: var(--font-mono);
  }
  .dark input[type="date"],
  .dark input[type="time"] {
    color-scheme: dark;
  }

  /* Date Picker: Sekali klik di mana saja langsung buka kalender */
  .date-picker-single-click {
    position: relative;
    cursor: pointer;
  }
  .date-picker-single-click::-webkit-calendar-picker-indicator {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  /* PWA safe area support */
  .safe-bottom {
    padding-bottom: env(safe-area-inset-bottom, 1rem);
  }

  /* SweetAlert2 Modern Card & Backdrop (Matching Logout & Login Success) */
  .swal2-container.swal2-backdrop-show,
  .swal2-container.swal2-noanimation {
    background: rgba(15, 23, 42, 0.65) !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
  }

  .swal2-popup:not(.swal2-toast) {
    font-family: var(--font-sans) !important;
    border-radius: 1.5rem !important;
    padding: 1.5rem !important;
    overflow: hidden !important;
    max-width: 24rem !important;
    width: 90% !important;
  }

  .swal2-popup:not(.swal2-toast) .swal2-icon {
    display: none !important;
  }

  .swal2-popup:not(.swal2-toast) .swal2-html-container {
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
  }

  .swal2-popup:not(.swal2-toast) .swal2-actions {
    margin: 1.25rem 0 0 0 !important;
    width: 100% !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
  }

  .swal2-actions:has(.swal2-cancel) {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 0.75rem !important;
  }

  .swal2-actions:has(.swal2-cancel) .swal2-cancel {
    order: 1 !important;
    margin: 0 !important;
    width: 100% !important;
  }

  .swal2-actions:has(.swal2-cancel) .swal2-confirm {
    order: 2 !important;
    margin: 0 !important;
    width: 100% !important;
  }

  .swal2-actions:not(:has(.swal2-cancel)) {
    display: flex !important;
    justify-content: center !important;
    width: 100% !important;
  }

  .swal2-actions:not(:has(.swal2-cancel)) .swal2-confirm {
    margin: 0 auto !important;
    width: 100% !important;
    max-width: 16rem !important;
  }

  /* Toast Notifikasi Ringan (Switch Dompet, Update Cepat) */
  .swal2-popup.swal2-toast {
    padding: 0.75rem 1.25rem !important;
    border-radius: 1rem !important;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1) !important;
    border: 1px solid rgba(226, 232, 240, 0.9) !important;
    backdrop-filter: blur(12px) !important;
    background: #ffffff !important;
    color: #0f172a !important;
    font-family: var(--font-sans) !important;
  }

  .dark .swal2-popup.swal2-toast {
    background: #0f172a !important;
    border-color: rgba(30, 41, 59, 0.9) !important;
    color: #ffffff !important;
  }

  .swal2-popup.swal2-toast .swal2-title {
    font-size: 0.875rem !important;
    font-weight: 700 !important;
    margin: 0 !important;
    color: inherit !important;
  }

  .swal2-popup.swal2-toast .swal2-icon {
    display: none !important;
  }

  .swal2-popup.swal2-toast .swal2-html-container {
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
    width: 100% !important;
  }

  /* Formal Print & PDF Styles for Financial Reports */
  @page {
    size: A4 portrait;
    margin: 10mm 12mm 12mm 12mm;
  }

  @page landscape-page {
    size: A4 landscape;
    margin: 8mm 10mm 10mm 10mm;
  }

  .print-landscape {
    page: landscape-page;
  }

  @media print {
    /* 1. Sembunyikan SEMUA elemen root di dalam body KECUALI modal print preview */
    body > *:not(#modal-print-preview) {
      display: none !important;
    }

    /* 2. Sembunyikan semua elemen non-cetak / toolbar */
    .no-print,
    .preview-toolbar,
    .modal-backdrop,
    .swal2-container,
    .print-only,
    header,
    aside,
    nav,
    footer,
    #mobile-bottom-nav,
    main {
      display: none !important;
    }

    /* Force pure white background & crisp dark slate text */
    html, body {
      background: #ffffff !important;
      color: #0f172a !important;
      font-size: 10pt !important;
      line-height: 1.4 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: auto !important;
      min-height: 0 !important;
      overflow: visible !important;
    }

    .md\:pl-72 {
      padding-left: 0 !important;
    }

    /* Print Preview Modal expands to full printable page */
    #modal-print-preview {
      position: static !important;
      display: block !important;
      padding: 0 !important;
      margin: 0 !important;
      background: #ffffff !important;
      overflow: visible !important;
      inset: auto !important;
      z-index: auto !important;
      box-shadow: none !important;
      border: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      width: 100% !important;
      height: auto !important;
      min-height: 0 !important;
    }

    #modal-print-preview .preview-container {
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
      display: block !important;
      overflow: visible !important;
    }

    #print-document-sheet {
      box-shadow: none !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
      background: #ffffff !important;
      color: #0f172a !important;
      border-radius: 0 !important;
      display: block !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Preserve colors on cards and badges when printing */
    #print-document-sheet * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Samakan tata letak 3 kartu ringkasan Laba Operasional di print persis seperti preview */
    #print-document-sheet .report-summary-cards-ops {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 0.75rem !important;
    }

    /* Samakan tata letak 4 kartu ringkasan Laporan Komprehensif di print persis seperti preview */
    #print-document-sheet .report-summary-cards-kmp {
      display: grid !important;
      grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      gap: 0.75rem !important;
    }

    /* Kop Surat tata letak horizontal di print */
    #print-document-sheet .kop-surat-header {
      display: flex !important;
      flex-direction: row !important;
      align-items: flex-start !important;
      justify-content: space-between !important;
      gap: 1rem !important;
    }

    /* Prevent awkward pagination cuts inside rows and cards */
    .avoid-break {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }

    table {
      width: 100% !important;
      border-collapse: collapse !important;
      page-break-inside: auto !important;
    }

    tr {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }

    thead {
      display: table-header-group !important;
    }

    tfoot {
      display: table-footer-group !important;
    }
  }

  /* PDF Generator Styling Optimization */
  #print-document-sheet.is-generating-pdf {
    box-shadow: none !important;
    border: none !important;
    border-radius: 0 !important;
    margin: 0 auto !important;
    padding: 20px 24px !important;
    background: #ffffff !important;
    color: #0f172a !important;
    box-sizing: border-box !important;
  }

  #print-document-sheet.is-generating-pdf.is-pdf-portrait {
    width: 794px !important;
    max-width: 794px !important;
    min-width: 794px !important;
  }

  #print-document-sheet.is-generating-pdf.is-pdf-landscape {
    width: 1122px !important;
    max-width: 1122px !important;
    min-width: 1122px !important;
  }

  #print-document-sheet.is-generating-pdf table {
    width: 100% !important;
    table-layout: auto !important;
    border-collapse: collapse !important;
  }

  #print-document-sheet.is-generating-pdf th,
  #print-document-sheet.is-generating-pdf td {
    vertical-align: middle !important;
  }

  /* Currency numbers and right-aligned totals must never wrap onto 2 lines */
  #print-document-sheet.is-generating-pdf .font-mono-num,
  #print-document-sheet.is-generating-pdf td[class*="text-right"],
  #print-document-sheet.is-generating-pdf th[class*="text-right"],
  #print-document-sheet.is-generating-pdf .whitespace-nowrap {
    white-space: nowrap !important;
  }

  /* Prevent text truncation with ellipsis inside exported PDF */
  #print-document-sheet.is-generating-pdf .truncate {
    overflow: visible !important;
    text-overflow: clip !important;
    white-space: normal !important;
  }

  #print-document-sheet.is-generating-pdf .report-summary-cards-ops {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 0.75rem !important;
  }

  #print-document-sheet.is-generating-pdf .report-summary-cards-kmp {
    display: grid !important;
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    gap: 0.75rem !important;
  }

  /* ================= MODERN BUTTON ANIMATIONS (TOMBOL SIMPAN) ================= */
  .btn-save-animated {
    position: relative;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    transform: translateZ(0);
    user-select: none;
  }

  /* Micro-lift on Hover */
  .btn-save-animated:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  /* Tactile Press Feel on Click */
  .btn-save-animated:active:not(:disabled) {
    transform: translateY(0px) scale(0.96);
  }

  /* Shimmer / Sheen Glint Sweep on Hover */
  .btn-save-animated::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -130%;
    width: 60%;
    height: 200%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.08) 25%,
      rgba(255, 255, 255, 0.35) 50%,
      rgba(255, 255, 255, 0.08) 75%,
      transparent 100%
    );
    transform: rotate(25deg);
    pointer-events: none;
    transition: none;
  }

  .btn-save-animated:hover:not(:disabled)::after {
    left: 170%;
    transition: left 0.75s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Icon Micro-interactions */
  .btn-save-animated .btn-icon {
    display: inline-block;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .btn-save-animated:hover:not(:disabled) .btn-icon {
    transform: scale(1.18);
  }

  .btn-save-animated:active:not(:disabled) .btn-icon {
    transform: scale(0.92);
  }

  /* Rich Color Shadow Bloom on Hover */
  .btn-save-animated.shadow-emerald-500\/25:hover:not(:disabled),
  .btn-save-animated.shadow-emerald-500\/20:hover:not(:disabled) {
    box-shadow: 0 12px 24px -6px rgba(16, 185, 129, 0.42), 0 4px 10px -2px rgba(16, 185, 129, 0.25);
  }
  .btn-save-animated.shadow-rose-500\/25:hover:not(:disabled) {
    box-shadow: 0 12px 24px -6px rgba(244, 63, 94, 0.42), 0 4px 10px -2px rgba(244, 63, 94, 0.25);
  }
  .btn-save-animated.shadow-blue-500\/20:hover:not(:disabled),
  .btn-save-animated.shadow-blue-500\/25:hover:not(:disabled) {
    box-shadow: 0 12px 24px -6px rgba(59, 130, 246, 0.42), 0 4px 10px -2px rgba(59, 130, 246, 0.25);
  }
  .btn-save-animated.shadow-purple-500\/20:hover:not(:disabled),
  .btn-save-animated.shadow-purple-500\/25:hover:not(:disabled) {
    box-shadow: 0 12px 24px -6px rgba(168, 85, 247, 0.42), 0 4px 10px -2px rgba(168, 85, 247, 0.25);
  }
  .btn-save-animated.shadow-amber-500\/25:hover:not(:disabled),
  .btn-save-animated.shadow-amber-600\/25:hover:not(:disabled),
  .btn-save-animated.shadow-amber-600\/20:hover:not(:disabled) {
    box-shadow: 0 12px 24px -6px rgba(245, 158, 11, 0.42), 0 4px 10px -2px rgba(245, 158, 11, 0.25);
  }
  .btn-save-animated.shadow-teal-500\/20:hover:not(:disabled),
  .btn-save-animated.shadow-teal-500\/25:hover:not(:disabled) {
    box-shadow: 0 12px 24px -6px rgba(20, 184, 166, 0.42), 0 4px 10px -2px rgba(20, 184, 166, 0.25);
  }

  /* Disabled State */
  .btn-save-animated:disabled {
    cursor: not-allowed !important;
    transform: none !important;
    opacity: 0.6 !important;
    box-shadow: none !important;
  }
</style>
