    },

    isItemInSelectedPeriod(dateStr) {
      if (this.isAllPeriod) return true;
      if (!dateStr) return false;
      const d = this.parseDateString(dateStr);
      if (isNaN(d.getTime())) return false;
      return d.getMonth() === this.selectedMonth && d.getFullYear() === this.selectedYear;
    },

    // UTILITIES & FORMATTERS
    formatRupiah(num) {
      if (num === null || num === undefined || isNaN(num)) return 'Rp 0';
      return 'Rp ' + Number(num).toLocaleString('id-ID');
    },

    formatDateInput(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${day}/${month}/${year} ${hours}:${minutes}`;
    },

    formatDateDisplay(str) {
      if (!str) return '-';
      if (str instanceof Date) {
        return this.formatDateInput(str);
      }
      if (typeof str === 'string') {
        const trimmed = str.trim();
        if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(trimmed)) {
          return trimmed;
        }
      }
      const d = this.parseDateString(str);
      if (!d || isNaN(d.getTime()) || d.getTime() === 0) return String(str);
      return this.formatDateInput(d);
    },

    formatDateOnly(str) {
      if (!str) return '-';
      if (str instanceof Date) {
        const day = String(str.getDate()).padStart(2, '0');
        const month = String(str.getMonth() + 1).padStart(2, '0');
        const year = str.getFullYear();
        return `${day}/${month}/${year}`;
      }
      if (typeof str === 'string') {
        const trimmed = str.trim();
        const matchSlash = trimmed.match(/^(\d{1,2}\/\d{1,2}\/\d{4})/);
        if (matchSlash) {
          return matchSlash[1];
        }
      }
      const d = this.parseDateString(str);
      if (!d || isNaN(d.getTime()) || d.getTime() === 0) {
        if (typeof str === 'string' && /^\d{4}-\d{2}-\d{2}/.test(str)) {
          const parts = str.substring(0, 10).split('-');
          return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return String(str);
      }
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}/${month}/${year}`;
    },

    parseDateString(str) {
      if (!str) return new Date(0);
      if (str instanceof Date) return str;
      try {
        if (typeof str === 'string') {
          const parts = str.trim().split(' ');
          const sep = parts[0].includes('/') ? '/' : (parts[0].includes('-') ? '-' : null);
          if (sep) {
            const dateParts = parts[0].split(sep);
            if (dateParts.length === 3) {
              if (dateParts[0].length === 4) {
                return new Date(str);
              }
              const timeParts = (parts[1] || '00:00').split(':');
              const day = parseInt(dateParts[0], 10);
              const month = parseInt(dateParts[1], 10) - 1;
              const year = parseInt(dateParts[2], 10);
              const hours = parseInt(timeParts[0] || 0, 10);
              const minutes = parseInt(timeParts[1] || 0, 10);
              return new Date(year, month, day, hours, minutes);
            }
          }
        }
      } catch (e) {}
      const fallback = new Date(str);
      return isNaN(fallback.getTime()) ? new Date(0) : fallback;
    },

    toInputDateFormat(d) {
      if (!d || isNaN(d.getTime())) d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    },

    toInputTimeFormat(d) {
      if (!d || isNaN(d.getTime())) d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${min}`;
    },

    openDatePicker(el) {
      if (el && typeof el.showPicker === 'function') {
        try {
          el.showPicker();
        } catch (e) {}
      }
    },

    formatDateFromInputs(dateStr, timeStr) {
      if (!dateStr) {
        const now = new Date();
        dateStr = this.toInputDateFormat(now);
        timeStr = timeStr || this.toInputTimeFormat(now);
      }
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const yyyy = parts[0];
        const mm = parts[1];
        const dd = parts[2];
        const time = timeStr || '00:00';
        return `${dd}/${mm}/${yyyy} ${time}`;
      }
      return dateStr;
    },

    setDateToday(formType) {
      const now = new Date();
      const dateStr = this.toInputDateFormat(now);
      const timeStr = this.toInputTimeFormat(now);
      if (formType === 'transfer') {
        this.transferForm.TanggalDate = dateStr;
        this.transferForm.TanggalTime = timeStr;
      } else {
        this.txnForm.TanggalDate = dateStr;
        this.txnForm.TanggalTime = timeStr;
      }
    },

    setDateYesterday(formType) {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const dateStr = this.toInputDateFormat(yesterday);
      const timeStr = this.toInputTimeFormat(yesterday);
      if (formType === 'transfer') {
        this.transferForm.TanggalDate = dateStr;
        this.transferForm.TanggalTime = timeStr;
      } else {
        this.txnForm.TanggalDate = dateStr;
        this.txnForm.TanggalTime = timeStr;
      }
    },

    isDateToday(dateStr) {
      if (!dateStr) return false;
      return dateStr === this.toInputDateFormat(new Date());
    },

    isDateYesterday(dateStr) {
      if (!dateStr) return false;
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return dateStr === this.toInputDateFormat(d);
    },

    addTxnItem() {
      const nextId = this.txnItems && this.txnItems.length > 0 ? Math.max(...this.txnItems.map(i => i.id)) + 1 : 1;
      const defaultCat = this.categories.find(c => c.Tipe === this.txnForm.TipeTransaksi)?.CategoryID || '';
      this.txnItems.push({
        id: nextId,
        Nominal: '',
        CategoryID: defaultCat,
        Deskripsi: ''
      });
    },

    removeTxnItem(index) {
      if (this.txnItems && this.txnItems.length > 1) {
        this.txnItems.splice(index, 1);
      }
    },

    setTxnType(type) {
      this.txnForm.TipeTransaksi = type;
      const defaultCat = this.categories.find(c => c.Tipe === type)?.CategoryID || '';
      this.txnForm.CategoryID = defaultCat;
      if (this.txnItems) {
        this.txnItems.forEach(item => {
          const cat = this.categories.find(c => c.CategoryID === item.CategoryID);
          if (!cat || cat.Tipe !== type) {
            item.CategoryID = defaultCat;
          }
        });
      }
    },

    addQuickNominal(item, amount) {
      item.Nominal = (Number(item.Nominal) || 0) + amount;
    },

    // Reset Form Helpers
    resetTxnForm() {
      this.isTxnTypeFixed = false;
      const now = new Date();
      const defaultCat = this.categories.find(c => c.Tipe === 'PENGELUARAN')?.CategoryID || '';
      this.txnForm = {
        TransactionID: '',
        Tanggal: this.formatDateInput(now),
        TanggalDate: this.toInputDateFormat(now),
        TanggalTime: this.toInputTimeFormat(now),
        TipeTransaksi: 'PENGELUARAN',
        AccountID: this.accounts.length > 0 ? this.accounts[0].AccountID : '',
        CategoryID: defaultCat,
        Nominal: '',
        Deskripsi: '',
        BuktiUrl: ''
      };
      this.txnItems = [
        { id: 1, Nominal: '', CategoryID: defaultCat, Deskripsi: '' }
      ];
    },

      const now = new Date();
      const fromAcc = this.accounts.length > 0 ? this.accounts[0].AccountID : '';
      const toAcc = this.accounts.length > 1 ? this.accounts[1].AccountID : '';
      this.transferForm = {
        TransferID: '',
        Tanggal: this.formatDateInput(now),
        TanggalDate: this.toInputDateFormat(now),
        TanggalTime: this.toInputTimeFormat(now),
        FromAccountID: fromAcc,
        ToAccountID: toAcc,
        Nominal: '',
        BiayaAdmin: 0,
        Catatan: ''
      };
    },

    resetAccountForm() {
      this.accountForm = {
        AccountID: '',
        NamaAkun: '',
        TipeAkun: 'BANK',
        NomorAkun: '',
        SaldoAwal: '',
        Warna: '#2563eb',
        Ikon: 'fa-building-columns'
      };
    },

      const t = this.accountForm.TipeAkun;

    resetCategoryForm(type = 'PENGELUARAN') {
      this.categoryForm = {
        CategoryID: '',
        NamaKategori: '',
        Tipe: type,
        Ikon: type === 'PEMASUKAN' ? 'fa-money-bill-wave' : 'fa-utensils',
        Warna: type === 'PEMASUKAN' ? '#10b981' : '#f97316',

        Urutan: this.categories.length + 1,

      };

    openAddCategoryModal(type = 'PENGELUARAN') {
      this.resetCategoryForm(type);
      this.showCategoryModal = true;

      if (this.isSystemCategory(cat)) {

          icon: 'info',

      };

    openSetBudgetModal(targetCat = null) {
      const expenseCats = this.categories.filter(c => c.Tipe === 'PENGELUARAN');
      if (expenseCats.length === 0) {
        Swal.fire({ icon: 'warning', title: 'Belum Ada Kategori', text: 'Tambahkan kategori pengeluaran terlebih dahulu di Master Data Kategori.' });
        return;
      }

      const selected = targetCat 
        ? (expenseCats.find(c => c.CategoryID === targetCat.CategoryID) || targetCat)
        : expenseCats[0];

      const breakdown = this.categoryBreakdown.find(b => b.CategoryID === selected.CategoryID);
      const spent = breakdown ? breakdown.spent : 0;

      this.budgetForm = {
        CategoryID: selected.CategoryID,
        NamaKategori: selected.NamaKategori,
        Ikon: selected.Ikon || 'fa-tag',
        Warna: selected.Warna || '#059669',
        spent: spent,
        BudgetBulanan: selected.BudgetBulanan ? Number(selected.BudgetBulanan) : ''
      };

      this.showBudgetModal = true;
    },

    onBudgetCategoryChange() {
      const cat = this.categories.find(c => c.CategoryID === this.budgetForm.CategoryID);
      if (cat) {
        const breakdown = this.categoryBreakdown.find(b => b.CategoryID === cat.CategoryID);
        this.budgetForm.NamaKategori = cat.NamaKategori;
        this.budgetForm.Ikon = cat.Ikon || 'fa-tag';
        this.budgetForm.Warna = cat.Warna || '#059669';
        this.budgetForm.spent = breakdown ? breakdown.spent : 0;
        this.budgetForm.BudgetBulanan = cat.BudgetBulanan ? Number(cat.BudgetBulanan) : '';
      }
    },

    async saveBudgetSetting() {
      if (!this.budgetForm.CategoryID) return;
      const cat = this.allCategories.find(c => c.CategoryID === this.budgetForm.CategoryID);
      if (!cat) return;

      this.isLoading = true;
      try {
        const newBudget = Number(this.budgetForm.BudgetBulanan) || 0;
        cat.BudgetBulanan = newBudget;

        this.refreshActiveWalletData();
        this.saveLocalData();

        try {
          await runApi('saveCategory', [cat]);
        } catch (e) {
          console.warn('Sync budget ke cloud gagal/offline:', e);
        }

        this.showBudgetModal = false;

        Swal.fire({
          icon: 'success',
          title: 'Anggaran Tersimpan!',
          text: newBudget > 0
            ? `Batas anggaran bulanan untuk ${cat.NamaKategori} diset ke ${this.formatRupiah(newBudget)}.`
            : `Batas anggaran bulanan untuk ${cat.NamaKategori} dinonaktifkan (Tanpa Limit).`,
          timer: 1800,
          showConfirmButton: false
        });
      } finally {
        this.isLoading = false;
      }
    },

    openAddTxnModal(type = 'PENGELUARAN', isFixed = false) {
      this.resetTxnForm();
      this.txnForm.TipeTransaksi = type;
      this.isTxnTypeFixed = !!isFixed;
      const defaultCat = this.categories.find(c => c.Tipe === type)?.CategoryID || '';
      this.txnForm.CategoryID = defaultCat;
      this.txnItems = [
        { id: 1, Nominal: '', CategoryID: defaultCat, Deskripsi: '' }
      ];
      this.showTxnModal = true;

      if (fromAccId) {
        this.transferForm.FromAccountID = fromAccId;
        const other = this.accounts.find(a => a.AccountID !== fromAccId);
        if (other) this.transferForm.ToAccountID = other.AccountID;
      }

    },

    openAddAccountModal() {
      this.resetAccountForm();
      this.showAccountModal = true;
    },

    openEditAccountModal(acc) {
      this.accountForm = {
        AccountID: acc.AccountID,
        NamaAkun: acc.NamaAkun,
        TipeAkun: acc.TipeAkun,
        NomorAkun: acc.NomorAkun,
        SaldoAwal: acc.SaldoAwal,
        Warna: acc.Warna || (acc.TipeAkun === 'BANK' ? '#2563eb' : (acc.TipeAkun === 'EWALLET' ? '#0284c7' : (acc.TipeAkun === 'INVESTASI' ? '#7c3aed' : '#059669'))),
        Ikon: acc.Ikon || (acc.TipeAkun === 'TUNAI' ? 'fa-wallet' : (acc.TipeAkun === 'EWALLET' ? 'fa-mobile-screen-button' : (acc.TipeAkun === 'INVESTASI' ? 'fa-chart-line' : 'fa-building-columns')))
      };
      this.showAccountModal = true;
    },

    async deleteAccountItem(acc) {
      if (!this.canDeleteAccount) {
        Swal.fire({
          icon: 'error',
          title: 'Akses Ditolak',
          text: 'Peran Pengguna (User) tidak memiliki izin untuk menghapus akun keuangan. Anda hanya dapat menambah atau mengedit akun.'
        });
        return;
      }

      const txnCount = this.allTransactions.filter(t => t.AccountID === acc.AccountID).length;
      const trfCount = this.allTransfers.filter(tr => tr.FromAccountID === acc.AccountID || tr.ToAccountID === acc.AccountID).length;
      const totalMutasi = txnCount + trfCount;

      let warningText = `Akun "${acc.NamaAkun}" akan dihapus secara permanen.`;
      if (totalMutasi > 0) {
        warningText = `Akun "${acc.NamaAkun}" memiliki ${totalMutasi} transaksi/transfer terkait. Akun akan dihapus dari daftar rekening aktif.`;
      }

      const confirm = await Swal.fire({
        title: `Hapus Akun "${acc.NamaAkun}"?`,
        text: warningText,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Ya, Hapus Akun',
        cancelButtonText: 'Batal'
      });

      if (!confirm.isConfirmed) return;

      this.isLoading = true;
      this.allAccounts = this.allAccounts.filter(a => a.AccountID !== acc.AccountID);
      this.refreshActiveWalletData();
      this.saveLocalData();

      try {
        await runApi('deleteAccount', [acc.AccountID, this.currentUser ? this.currentUser.Role : 'user']);
      } catch (e) {
        console.warn('Sync delete account offline/failed:', e);
      }

      this.isLoading = false;
      Swal.fire({
        icon: 'success',
        title: 'Akun Berhasil Dihapus',
        text: `Akun "${acc.NamaAkun}" berhasil dihapus.`,
        timer: 1600,
        showConfirmButton: false
      });
    },

    openDetailModal(item) {
      this.selectedDetailItem = item;
      this.showDetailModal = true;
    },

    openEditHistoryItem(item) {
      if (!item) return;
      if (this.showDetailModal) {
        this.showDetailModal = false;
      }
      if (item.id && String(item.id).startsWith('TXN-ADM-')) {
        const trfId = String(item.id).replace('TXN-ADM-', '');
        const linkedTrf = this.allTransfers.find(t => t.TransferID === trfId);
        if (linkedTrf) {
          const parsed = this.parseDateString(linkedTrf.Tanggal);
          this.transferForm = {
            TransferID: linkedTrf.TransferID,
            Tanggal: linkedTrf.Tanggal,
            TanggalDate: this.toInputDateFormat(parsed),
            TanggalTime: this.toInputTimeFormat(parsed),
            FromAccountID: linkedTrf.FromAccountID,
            ToAccountID: linkedTrf.ToAccountID,
            Nominal: Number(linkedTrf.Nominal) || '',
            BiayaAdmin: Number(linkedTrf.BiayaAdmin) || 0,
            Catatan: linkedTrf.Catatan || ''
          };
          this.showTransferModal = true;
          return;
        }
      }
      if (item.itemType === 'TRANSFER') {
        const raw = item.raw || this.transfers.find(t => t.TransferID === item.id);
        if (!raw) return;
        const parsed = this.parseDateString(raw.Tanggal);
        this.transferForm = {
          TransferID: raw.TransferID,
          Tanggal: raw.Tanggal,
          TanggalDate: this.toInputDateFormat(parsed),
          TanggalTime: this.toInputTimeFormat(parsed),
          FromAccountID: raw.FromAccountID,
          ToAccountID: raw.ToAccountID,
          Nominal: Number(raw.Nominal) || '',
          BiayaAdmin: Number(raw.BiayaAdmin) || 0,
          Catatan: raw.Catatan || ''
        };
        this.showTransferModal = true;
      } else {
        const raw = item.raw || this.transactions.find(t => t.TransactionID === item.id);
        if (!raw) return;
        const parsed = this.parseDateString(raw.Tanggal);
        this.isTxnTypeFixed = true;
        this.txnForm = {
          TransactionID: raw.TransactionID,
          Tanggal: raw.Tanggal,
          TanggalDate: this.toInputDateFormat(parsed),
          TanggalTime: this.toInputTimeFormat(parsed),
          TipeTransaksi: raw.TipeTransaksi || 'PENGELUARAN',
          AccountID: raw.AccountID,
          CategoryID: raw.CategoryID,
          Nominal: Number(raw.Nominal) || '',
          Deskripsi: raw.Deskripsi || '',
          BuktiUrl: raw.BuktiUrl || ''
        };
        this.txnItems = [
          { id: 1, Nominal: Number(raw.Nominal) || '', CategoryID: raw.CategoryID, Deskripsi: raw.Deskripsi || '' }
        ];
        this.showTxnModal = true;
      }
    },

    // AKSI TRANSAKSI (PEMASUKAN & PENGELUARAN - SINGLE & MULTI ITEM)
    async submitTransaction() {
      if (!this.txnForm.AccountID) {
        Swal.fire({ icon: 'warning', title: 'Pilih Akun', text: 'Tentukan akun yang digunakan untuk transaksi ini' });
        return;
      }

      // Validasi item nominal
      const validItems = (this.txnItems || []).filter(item => Number(item.Nominal) > 0);
      if (validItems.length === 0) {
        Swal.fire({ icon: 'warning', title: 'Nominal Kosong', text: 'Masukkan nominal transaksi lebih dari 0' });
        return;
      }

      const invalidItem = (this.txnItems || []).find(item => !item.Nominal || Number(item.Nominal) <= 0);
      if (invalidItem) {
        Swal.fire({ icon: 'warning', title: 'Periksa Nominal Item', text: 'Terdapat baris transaksi dengan nominal 0 atau belum terisi.' });
        return;
      }

      const totalNominal = this.totalBatchNominal;
      const targetAcc = this.allAccounts.find(a => a.AccountID === this.txnForm.AccountID);
      const isEdit = !!this.txnForm.TransactionID;

      this.isLoading = true;

      // Cek saldo jika pengeluaran
      if (this.txnForm.TipeTransaksi === 'PENGELUARAN' && targetAcc) {
        let currentBalance = Number(targetAcc.SaldoSekarang) || 0;
        if (isEdit) {
          const oldTxn = this.allTransactions.find(t => t.TransactionID === this.txnForm.TransactionID);
          if (oldTxn && oldTxn.AccountID === targetAcc.AccountID) {
            currentBalance += (oldTxn.TipeTransaksi === 'PEMASUKAN' ? -Number(oldTxn.Nominal) : Number(oldTxn.Nominal));
          }
        }
        if (currentBalance < totalNominal) {
          const proceed = await Swal.fire({
            title: 'Saldo Tidak Cukup?',
            text: `Saldo di ${targetAcc.NamaAkun} saat ini ${this.formatRupiah(targetAcc.SaldoSekarang)}, transaksi total ${this.formatRupiah(totalNominal)} akan membuat saldo minus. Lanjutkan?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Ya, Tetap Simpan',
            cancelButtonText: 'Batal'
          });
          if (!proceed.isConfirmed) {
            this.isLoading = false;
            return;
          }
        }
      }

      const formattedTanggal = this.formatDateFromInputs(this.txnForm.TanggalDate, this.txnForm.TanggalTime);
      const timestamp = new Date().getTime();
      const createdPayloads = [];

      if (isEdit) {
        // Mode Edit: Update single transaction
        const oldIdx = this.allTransactions.findIndex(t => t.TransactionID === this.txnForm.TransactionID);
        if (oldIdx !== -1) {
          const oldTxn = this.allTransactions[oldIdx];
          const oldAccount = this.allAccounts.find(a => a.AccountID === oldTxn.AccountID);
          if (oldAccount) {
            const revertDelta = (oldTxn.TipeTransaksi === 'PEMASUKAN') ? -Number(oldTxn.Nominal) : Number(oldTxn.Nominal);
            oldAccount.SaldoSekarang = (Number(oldAccount.SaldoSekarang) || 0) + revertDelta;
          }
        }

        const firstItem = this.txnItems[0];
        const catObj = this.categories.find(c => c.CategoryID === firstItem.CategoryID);
        const defaultName = catObj ? catObj.NamaKategori : (this.txnForm.TipeTransaksi === 'PEMASUKAN' ? 'Pemasukan' : 'Pengeluaran');
        const deskripsi = (firstItem.Deskripsi && firstItem.Deskripsi.trim()) ? firstItem.Deskripsi.trim() : defaultName;

        const payload = {
          TransactionID: this.txnForm.TransactionID,
          WalletID: this.activeWalletId,
          Tanggal: formattedTanggal,
          TipeTransaksi: this.txnForm.TipeTransaksi,
          AccountID: this.txnForm.AccountID,
          CategoryID: firstItem.CategoryID || this.txnForm.CategoryID,
          Nominal: Number(firstItem.Nominal),
          Deskripsi: deskripsi,
          BuktiUrl: this.txnForm.BuktiUrl || '',
          KasirUsername: this.currentUser ? this.currentUser.Username : 'superadmin'
        };

        if (oldIdx !== -1) {
          this.allTransactions[oldIdx] = payload;
        }
        const delta = (payload.TipeTransaksi === 'PEMASUKAN') ? payload.Nominal : -payload.Nominal;
        if (targetAcc) {
          targetAcc.SaldoSekarang = (Number(targetAcc.SaldoSekarang) || 0) + delta;
        }
        createdPayloads.push(payload);

      } else {
        // Mode Baru: Simpan multi-transaksi / batch
        this.txnItems.forEach((item, idx) => {
          const txnId = 'TXN-' + (timestamp + idx);
          const catObj = this.categories.find(c => c.CategoryID === item.CategoryID);
          const defaultName = catObj ? catObj.NamaKategori : (this.txnForm.TipeTransaksi === 'PEMASUKAN' ? 'Pemasukan' : 'Pengeluaran');
          const deskripsi = (item.Deskripsi && item.Deskripsi.trim()) ? item.Deskripsi.trim() : defaultName;

          const payload = {
            TransactionID: txnId,
            WalletID: this.activeWalletId,
            Tanggal: formattedTanggal,
            TipeTransaksi: this.txnForm.TipeTransaksi,
            AccountID: this.txnForm.AccountID,
            CategoryID: item.CategoryID || this.txnForm.CategoryID,
            Nominal: Number(item.Nominal),
            Deskripsi: deskripsi,
            BuktiUrl: this.txnForm.BuktiUrl || '',
            KasirUsername: this.currentUser ? this.currentUser.Username : 'superadmin'
          };

          this.allTransactions.unshift(payload);
          createdPayloads.push(payload);
        });

        const delta = (this.txnForm.TipeTransaksi === 'PEMASUKAN') ? totalNominal : -totalNominal;
        if (targetAcc) {
          targetAcc.SaldoSekarang = (Number(targetAcc.SaldoSekarang) || 0) + delta;
        }
      }

      this.refreshActiveWalletData();
      this.saveLocalData();

      // Sync cloud untuk setiap transaksi
      for (const p of createdPayloads) {
        try {
          await runApi('saveTransaction', [p]);
        } catch (e) {
          console.warn('Sync cloud transaksi offline:', e);
        }
      }

      this.isLoading = false;
      this.showTxnModal = false;

      const count = createdPayloads.length;
      const tipeStr = this.txnForm.TipeTransaksi === 'PEMASUKAN' ? 'Pemasukan' : 'Pengeluaran';
      Swal.fire({
        icon: 'success',
        title: count > 1 ? `${count} Transaksi Tersimpan!` : 'Transaksi Tersimpan!',
        text: count > 1
          ? `Sebanyak ${count} transaksi ${tipeStr} dengan total ${this.formatRupiah(totalNominal)} berhasil dicatat.`
          : `Transaksi ${tipeStr} senilai ${this.formatRupiah(totalNominal)} berhasil dicatat.`,
        timer: 2000,
        showConfirmButton: false
      });
    },

    // AKSI PINDAH DANA (TRANSFER ANTAR AKUN)
    async submitTransfer() {
      const nominal = Number(this.transferForm.Nominal);
      const biayaAdmin = Number(this.transferForm.BiayaAdmin) || 0;
      const totalKeluar = nominal + biayaAdmin;

      if (!this.transferForm.FromAccountID || !this.transferForm.ToAccountID) {
        Swal.fire({ icon: 'warning', title: 'Pilih Akun', text: 'Tentukan akun pengirim dan akun tujuan' });
        return;
      }

      if (this.transferForm.FromAccountID === this.transferForm.ToAccountID) {
        Swal.fire({ icon: 'warning', title: 'Akun Sama', text: 'Akun asal dan akun tujuan tidak boleh sama' });
        return;
      }

      if (!nominal || nominal <= 0) {
        Swal.fire({ icon: 'warning', title: 'Nominal Kosong', text: 'Masukkan nominal transfer lebih dari 0' });
        return;
      }

      const isEdit = !!this.transferForm.TransferID;
      let oldTrf = null;
      let oldIdx = -1;
      let oldFromAcc = null;
      let oldToAcc = null;
      let oldTotalKeluar = 0;
      let oldNominal = 0;

      if (isEdit) {
        oldIdx = this.allTransfers.findIndex(t => t.TransferID === this.transferForm.TransferID);
        if (oldIdx !== -1) {
          oldTrf = this.allTransfers[oldIdx];
          oldFromAcc = this.allAccounts.find(a => a.AccountID === oldTrf.FromAccountID);
          oldToAcc = this.allAccounts.find(a => a.AccountID === oldTrf.ToAccountID);
          oldNominal = Number(oldTrf.Nominal) || 0;
          oldTotalKeluar = Number(oldTrf.TotalKeluar) || (oldNominal + (Number(oldTrf.BiayaAdmin) || 0));

          if (oldFromAcc) oldFromAcc.SaldoSekarang = (Number(oldFromAcc.SaldoSekarang) || 0) + oldTotalKeluar;
          if (oldToAcc) oldToAcc.SaldoSekarang = (Number(oldToAcc.SaldoSekarang) || 0) - oldNominal;
        }
      }

      const fromAcc = this.allAccounts.find(a => a.AccountID === this.transferForm.FromAccountID);
      const toAcc = this.allAccounts.find(a => a.AccountID === this.transferForm.ToAccountID);

      if (!fromAcc || !toAcc) {
        if (isEdit) {
          if (oldFromAcc) oldFromAcc.SaldoSekarang = (Number(oldFromAcc.SaldoSekarang) || 0) - oldTotalKeluar;
          if (oldToAcc) oldToAcc.SaldoSekarang = (Number(oldToAcc.SaldoSekarang) || 0) + oldNominal;
        }
        Swal.fire({ icon: 'error', title: 'Data Akun Error', text: 'Akun yang dipilih tidak valid' });
        return;
      }

      // Validasi Saldo Asal
      if (Number(fromAcc.SaldoSekarang) < totalKeluar) {
        if (isEdit) {
          if (oldFromAcc) oldFromAcc.SaldoSekarang = (Number(oldFromAcc.SaldoSekarang) || 0) - oldTotalKeluar;
          if (oldToAcc) oldToAcc.SaldoSekarang = (Number(oldToAcc.SaldoSekarang) || 0) + oldNominal;
        }
        Swal.fire({
          icon: 'error',
          title: 'Saldo Tidak Cukup',
          html: `Saldo di <b>${fromAcc.NamaAkun}</b> adalah <b>${this.formatRupiah(fromAcc.SaldoSekarang)}</b>.<br>Total yang dibutuhkan (Transfer + Biaya Admin): <b>${this.formatRupiah(totalKeluar)}</b>`
        });
        return;
      }

      this.isLoading = true;

      // Update Saldo Baru
      fromAcc.SaldoSekarang = (Number(fromAcc.SaldoSekarang) || 0) - totalKeluar;
      toAcc.SaldoSekarang = (Number(toAcc.SaldoSekarang) || 0) + nominal;

      const trfId = this.transferForm.TransferID || ('TRF-' + new Date().getTime());
      const formattedTanggal = this.formatDateFromInputs(this.transferForm.TanggalDate, this.transferForm.TanggalTime);
      const payload = {
        TransferID: trfId,
        WalletID: this.activeWalletId,
        Tanggal: formattedTanggal,
        FromAccountID: this.transferForm.FromAccountID,
        ToAccountID: this.transferForm.ToAccountID,
        Nominal: nominal,
        BiayaAdmin: biayaAdmin,
        TotalKeluar: totalKeluar,
        Catatan: this.transferForm.Catatan || 'Pindah Dana',
        KasirUsername: this.currentUser ? this.currentUser.Username : 'superadmin'
      };

      if (isEdit && oldIdx !== -1) {
        this.allTransfers[oldIdx] = payload;
      } else {
        this.allTransfers.unshift(payload);
      }

      // Sinkronkan transaksi pengeluaran biaya admin ke allTransactions dengan kategori Admin Bank
      const admTxnId = 'TXN-ADM-' + trfId;
      this.allTransactions = this.allTransactions.filter(t => t.TransactionID !== admTxnId);
      if (biayaAdmin > 0) {
        const adminCat = this.getAdminBankCategory(this.activeWalletId);
        const adminCatId = adminCat ? adminCat.CategoryID : 'CAT-OUT-7';
        this.allTransactions.unshift({
          TransactionID: admTxnId,
          WalletID: this.activeWalletId,
          Tanggal: formattedTanggal,
          TipeTransaksi: 'PENGELUARAN',
          AccountID: this.transferForm.FromAccountID,
          CategoryID: adminCatId,
          Nominal: biayaAdmin,
          Deskripsi: `Biaya Admin Transfer (${fromAcc.NamaAkun} → ${toAcc.NamaAkun})`,
          BuktiUrl: '',
          KasirUsername: this.currentUser ? this.currentUser.Username : 'superadmin',
          IsSystem: 'TRUE',
          IsTransferAdmin: true
        });
      }

      this.refreshActiveWalletData();
      this.saveLocalData();

      try {
        await runApi('saveTransfer', [payload]);
      } catch (e) {
        console.warn('Sync cloud transfer gagal/offline:', e);
      }

      this.isLoading = false;
      this.showTransferModal = false;

      Swal.fire({
        icon: 'success',
        title: isEdit ? 'Pindah Dana Diperbarui!' : 'Pindah Dana Berhasil!',
        html: `Berhasil ${isEdit ? 'memperbarui data' : 'memindahkan'} <b>${this.formatRupiah(nominal)}</b> dari <b>${fromAcc.NamaAkun}</b> ke <b>${toAcc.NamaAkun}</b>!`,
        timer: 2000,
        showConfirmButton: false
      });
    },

    // AKSI KELOLA AKUN
    async submitAccount() {
      if (!this.accountForm.NamaAkun.trim()) {
        Swal.fire({ icon: 'warning', title: 'Nama Akun Wajib Diisi' });
        return;
      }

      this.isLoading = true;
      try {
        const isEdit = !!this.accountForm.AccountID;
        const accId = this.accountForm.AccountID || ('ACC-' + new Date().getTime());
        const saldoAwal = Number(this.accountForm.SaldoAwal) || 0;

        let saldoSekarang = saldoAwal;
        if (isEdit) {
          const existingAcc = this.allAccounts.find(a => a.AccountID === accId);
          const oldSaldoAwal = Number(existingAcc?.SaldoAwal) || 0;
          const oldSaldoSekarang = Number(existingAcc?.SaldoSekarang !== undefined ? existingAcc.SaldoSekarang : oldSaldoAwal);
          const diffSaldoAwal = saldoAwal - oldSaldoAwal;
          saldoSekarang = oldSaldoSekarang + diffSaldoAwal;
        }

        const payload = {
          AccountID: accId,
          WalletID: this.activeWalletId,
          NamaAkun: this.accountForm.NamaAkun.trim(),
          TipeAkun: this.accountForm.TipeAkun,
          NomorAkun: this.accountForm.NomorAkun || '-',
          SaldoAwal: saldoAwal,
          SaldoSekarang: saldoSekarang,
          Warna: this.accountForm.Warna || '#059669',
          Ikon: this.accountForm.Ikon || 'fa-building-columns',
          IsActive: 'TRUE'
        };

        if (isEdit) {
          const idx = this.allAccounts.findIndex(a => a.AccountID === accId);
          if (idx !== -1) {
            this.allAccounts[idx] = { ...this.allAccounts[idx], ...payload };
          }
        } else {
          this.allAccounts.push(payload);
        }

        this.refreshActiveWalletData();
        this.saveLocalData();

        try {
          await runApi('saveAccount', [payload]);
        } catch (e) {
          console.warn('Sync akun ke cloud gagal/offline:', e);
        }

        this.showAccountModal = false;
        Swal.fire({
          icon: 'success',
          title: isEdit ? 'Akun Diperbarui!' : 'Akun Baru Ditambahkan!',
          timer: 1500,
          showConfirmButton: false
        });
      } finally {
        this.isLoading = false;
      }
    },

    // AKSI KELOLA KATEGORI (MASTER DATA)

        const budget = Number(this.categoryForm.BudgetBulanan) || 0;

        };

    async deleteCategoryItem(cat) {
      if (this.isSystemCategory(cat)) {
        Swal.fire({
          icon: 'warning',
          title: 'Kategori Sistem Baku',
          html: `Kategori <b>${cat.NamaKategori}</b> merupakan kategori baku sistem yang diperlukan untuk pembukuan dan laporan keuangan, sehingga <b>tidak dapat dihapus</b>.`
        });
        return;
      }

      if (!this.canDeleteCategory) {
        Swal.fire({
          icon: 'error',
          title: 'Akses Ditolak',
          text: 'Peran Pengguna (User) tidak memiliki izin untuk menghapus kategori master. Anda hanya dapat menambah atau mengedit kategori.'
        });
        return;
      }

      const usedCount = this.transactions.filter(t => t.CategoryID === cat.CategoryID).length;
      if (usedCount > 0) {
        const warn = await Swal.fire({
          title: 'Kategori Sedang Digunakan',
          html: `Kategori <b>${cat.NamaKategori}</b> saat ini dipakai di <b>${usedCount} transaksi</b>.<br>Jika dihapus, transaksi terkait akan tetap ada namun tanpa nama kategori ini. Lanjutkan?`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#ef4444',
          confirmButtonText: 'Ya, Tetap Hapus',
          cancelButtonText: 'Batal'
        });
        if (!warn.isConfirmed) return;
      } else {
        const confirm = await Swal.fire({
          title: 'Hapus Kategori?',
          text: `Kategori "${cat.NamaKategori}" akan dihapus dari daftar master data.`,
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#ef4444',
          confirmButtonText: 'Hapus',
          cancelButtonText: 'Batal'
        });
        if (!confirm.isConfirmed) return;
      }

      this.allCategories = this.allCategories.filter(c => c.CategoryID !== cat.CategoryID);
      this.refreshActiveWalletData();
      this.saveLocalData();

      try {
        await runApi('deleteCategory', [cat.CategoryID, this.currentUser ? this.currentUser.Role : 'user']);
      } catch (e) {}

      Swal.fire({
        icon: 'success',
        title: 'Kategori Berhasil Dihapus',
        timer: 1400,
        showConfirmButton: false
      });
    },

    // HAPUS TRANSAKSI & REVERT SALDO
    async deleteHistoryItem(item) {
      if (item.id && String(item.id).startsWith('TXN-ADM-')) {
        Swal.fire({
          icon: 'info',
          title: 'Terikat Pindah Dana',
          text: 'Biaya admin ini terhubung langsung dengan transaksi Pindah Dana. Untuk menghapus atau mengubah biaya admin, silakan batalkan atau ubah transaksi Pindah Dana terkait.'
        });
        return;
      }

      const confirm = await Swal.fire({
        title: 'Hapus Catatan Ini?',
        text: `Data ${item.tipe === 'PINDAH_DANA' ? 'Pindah Dana' : 'Transaksi'} sebesar ${this.formatRupiah(item.nominal)} akan dihapus dan saldo akun akan dikembalikan ke kondisi semula.`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Hapus',
        cancelButtonText: 'Batal'
      });

      if (!confirm.isConfirmed) return;

      this.isLoading = true;

      if (item.itemType === 'TRANSFER') {
        const fromAcc = this.allAccounts.find(a => a.AccountID === item.raw.FromAccountID);
        const toAcc = this.allAccounts.find(a => a.AccountID === item.raw.ToAccountID);
        if (fromAcc) fromAcc.SaldoSekarang = Number(fromAcc.SaldoSekarang) + Number(item.raw.TotalKeluar);
        if (toAcc) toAcc.SaldoSekarang = Number(toAcc.SaldoSekarang) - Number(item.raw.Nominal);

        this.allTransfers = this.allTransfers.filter(tr => tr.TransferID !== item.id);
        const admTxnId = 'TXN-ADM-' + item.id;
        this.allTransactions = this.allTransactions.filter(t => t.TransactionID !== admTxnId);

        try {
          await runApi('deleteTransfer', [item.id]);
        } catch (e) {}
      } else {
        const acc = this.allAccounts.find(a => a.AccountID === item.raw.AccountID);
        if (acc) {
          const delta = (item.raw.TipeTransaksi === 'PEMASUKAN') ? -Number(item.raw.Nominal) : Number(item.raw.Nominal);
          acc.SaldoSekarang = Number(acc.SaldoSekarang) + delta;
        }

        this.allTransactions = this.allTransactions.filter(t => t.TransactionID !== item.id);
        try {
          await runApi('deleteTransaction', [item.id]);
        } catch (e) {}
      }

      this.refreshActiveWalletData();
      this.saveLocalData();
      this.isLoading = false;
      if (this.showDetailModal) this.showDetailModal = false;

      Swal.fire({
        icon: 'success',
        title: 'Berhasil Dihapus',
        text: 'Saldo akun telah disesuaikan kembali',
        timer: 1500,
        showConfirmButton: false
      });
    },

    setQuickNominal(target, amount) {
      if (target === 'transfer') {
        if (amount === 'all') {
          this.setTransferAllBalance();
          return;
        }
        this.transferForm.Nominal = amount;
      } else if (target === 'txn') {
        this.txnForm.Nominal = amount;
      }
    },

    setTransferAllBalance() {
      // Jika akun asal belum dipilih, otomatis gunakan akun pertama yang tersedia
      if (!this.transferForm.FromAccountID && this.accounts && this.accounts.length > 0) {
        this.transferForm.FromAccountID = this.accounts[0].AccountID;
        if (!this.transferForm.ToAccountID && this.accounts.length > 1) {
          this.transferForm.ToAccountID = this.accounts[1].AccountID;
        }
      }
      if (!this.transferForm.FromAccountID) return;
      const fromAcc = (this.accounts || []).find(a => a.AccountID === this.transferForm.FromAccountID) ||
                      (this.allAccounts || []).find(a => a.AccountID === this.transferForm.FromAccountID);
      if (!fromAcc) return;
      const saldo = Number(fromAcc.SaldoSekarang) || 0;
      const admin = Number(this.transferForm.BiayaAdmin) || 0;
      const transferAmount = (admin > 0 && saldo > admin) ? (saldo - admin) : saldo;
      this.transferForm.Nominal = transferAmount > 0 ? transferAmount : (saldo > 0 ? saldo : 0);
    },

    // ================= CADANGAN & ARSIP TAHUNAN METHODS =================
    extractYearFromStr(dateStr) {
      if (!dateStr) return null;
      const d = this.parseDateString(dateStr);
      if (!isNaN(d.getTime())) return d.getFullYear();
      return null;
    },

    async loadArchiveYears() {
      try {
        const res = await runApi('getArchiveYears');
        if (res && res.success && Array.isArray(res.years)) {
          this.archiveYears = res.years;
          this.archivesList = res.archives || [];
        } else {
          const stored = localStorage.getItem('DOMPETKU_ARCHIVES');
          if (stored) {
            const parsed = JSON.parse(stored);
            this.archiveYears = Object.keys(parsed).map(Number).sort((a, b) => b - a);
            this.archivesList = Object.values(parsed).map(p => p.meta);
          }
        }
      } catch (e) {
        console.warn('Error loadArchiveYears:', e);
      }
    },

    async selectArchiveYear(year) {
      if (year === null || year === '' || year === 'active') {
        this.selectedArchiveYear = null;
        this.archiveData = null;
        this.refreshActiveWalletData();
        return;
      }
      this.isLoadingArchive = true;
      try {
        const y = Number(year);
        let data = null;
        const res = await runApi('getArchiveData', [y]);
        if (res && res.success) {
          data = res;
        } else {
          const stored = localStorage.getItem('DOMPETKU_ARCHIVES');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed[y]) data = parsed[y];
          }
        }

        if (data) {
          this.selectedArchiveYear = y;
          this.archiveData = data;
          this.refreshActiveWalletData();
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Gagal Memuat Arsip',
            text: 'Data arsip tahun ' + y + ' tidak ditemukan.',
            customClass: { popup: 'swal2-modern-card' }
          });
        }
      } finally {
        this.isLoadingArchive = false;
      }
    },

    async processYearlyArchive() {
      const summary = this.archiveSummaryForSelectedYear;
      if (summary.txnCount === 0 && summary.trfCount === 0) {
        Swal.fire({
          icon: 'info',
          title: 'Tidak Ada Data',
          text: `Tidak ada mutasi transaksi aktif pada tahun ${summary.year} untuk diarsipkan.`,
          customClass: { popup: 'swal2-modern-card' }
        });
        return;
      }

      const confirm = await Swal.fire({
        title: `Tutup Buku Tahun ${summary.year}?`,
        html: `
          <div class="text-left text-sm space-y-3 mt-3 text-slate-600 dark:text-slate-300">
            <p>Tindakan ini akan mengarsipkan mutasi dan mereset sheet transaksi aktif:</p>
            <div class="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 space-y-1.5 text-xs text-emerald-800 dark:text-emerald-300">
              <div class="flex justify-between"><span>Total Transaksi Diarsip:</span><b>${summary.txnCount} baris</b></div>
              <div class="flex justify-between"><span>Total Pindah Dana Diarsip:</span><b>${summary.trfCount} baris</b></div>
              <div class="flex justify-between"><span>Tab Target:</span><b>Archive_Transactions_${summary.year}</b></div>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              ✓ Sheet transaksi aktif akan kosong dan kembali ringan.<br>
              ✓ Saldo akhir setiap rekening dikunci menjadi Saldo Awal baru.<br>
              ✓ Data arsip tetap dapat diakses di menu Arsip.
            </p>
          </div>
        `,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Ya, Tutup Buku & Arsipkan',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#059669',
        cancelButtonColor: '#64748b',
        reverseButtons: true,
        customClass: { popup: 'swal2-modern-card' }
      });

      if (!confirm.isConfirmed) return;

      this.isProcessingArchive = true;
      try {
        const res = await runApi('archiveYearData', [summary.year, this.currentUser.Username]);
        
        // Mode offline / standalone fallback jika web app URL masih placeholder
        if (!res || !res.success) {
          if (!WEB_APP_URLS || WEB_APP_URLS[0].includes('...')) {
            const y = summary.year;
            const archivedTxns = this.allTransactions.filter(t => this.extractYearFromStr(t.Tanggal) === y);
            const archivedTrfs = this.allTransfers.filter(tr => this.extractYearFromStr(tr.Tanggal) === y);
            
            this.allTransactions = this.allTransactions.filter(t => this.extractYearFromStr(t.Tanggal) !== y);
            this.allTransfers = this.allTransfers.filter(tr => this.extractYearFromStr(tr.Tanggal) !== y);
            
            // Kunci saldo awal
            this.allAccounts.forEach(a => {
              a.SaldoAwal = a.SaldoSekarang;
            });

            let archives = {};
            try {
              archives = JSON.parse(localStorage.getItem('DOMPETKU_ARCHIVES') || '{}');
            } catch(e) {}

            const arcMeta = {
              ArchiveID: 'ARC-' + y + '-' + Date.now(),
              Tahun: y,
              TanggalArsip: this.formatDateInput(new Date()),
              TotalTransaksi: archivedTxns.length,
              TotalPindahDana: archivedTrfs.length,
              Operator: this.currentUser.Username,
              Status: 'TERARSIP'
            };

            archives[y] = {
              year: y,
              transactions: archivedTxns,
              transfers: archivedTrfs,
              meta: arcMeta
            };

            localStorage.setItem('DOMPETKU_ARCHIVES', JSON.stringify(archives));
            this.saveLocalData();
            await this.loadArchiveYears();
            this.refreshActiveWalletData();

            Swal.fire({
              icon: 'success',
              title: 'Tutup Buku Berhasil!',
              text: `${archivedTxns.length} transaksi & ${archivedTrfs.length} pindah dana tahun ${y} berhasil dipindahkan ke arsip!`,
              customClass: { popup: 'swal2-modern-card' }
            });
            return;
          }

          Swal.fire({
            icon: 'error',
            title: 'Gagal Mengarsipkan',
            text: res ? res.message : 'Koneksi backend gagal.',
            customClass: { popup: 'swal2-modern-card' }
          });
          return;
        }

        // Server success
        await this.syncFromCloud();
        await this.loadArchiveYears();

        Swal.fire({
          icon: 'success',
          title: 'Tutup Buku Berhasil!',
          text: res.message,
          customClass: { popup: 'swal2-modern-card' }
        });
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Terjadi Kesalahan',
          text: err.toString(),
          customClass: { popup: 'swal2-modern-card' }
        });
      } finally {
        this.isProcessingArchive = false;
      }
    },

    async restoreArchive(year) {
      const confirm = await Swal.fire({
        title: `Pulihkan Arsip Tahun ${year}?`,
        text: `Data transaksi tahun ${year} akan dikembalikan ke sheet transaksi aktif.`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Pulihkan ke Sheet Aktif',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#2563eb',
        cancelButtonColor: '#64748b',
        reverseButtons: true,
        customClass: { popup: 'swal2-modern-card' }
      });

      if (!confirm.isConfirmed) return;

      try {
        const res = await runApi('restoreArchiveData', [year]);
        if (!res || !res.success) {
          const stored = localStorage.getItem('DOMPETKU_ARCHIVES');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed[year]) {
              this.allTransactions.push(...parsed[year].transactions);
              this.allTransfers.push(...parsed[year].transfers);
              delete parsed[year];
              localStorage.setItem('DOMPETKU_ARCHIVES', JSON.stringify(parsed));
              this.saveLocalData();
              await this.loadArchiveYears();
              this.refreshActiveWalletData();
              Swal.fire({
                icon: 'success',
                title: 'Data Dipulihkan!',
                text: `Transaksi tahun ${year} berhasil dipulihkan ke sheet aktif.`,
                customClass: { popup: 'swal2-modern-card' }
              });
              return;
            }
          }
          Swal.fire({
            icon: 'error',
            title: 'Gagal Memulihkan',
            text: res ? res.message : 'Server error',
            customClass: { popup: 'swal2-modern-card' }
          });
          return;
        }

        await this.syncFromCloud();
        await this.loadArchiveYears();
        Swal.fire({
          icon: 'success',
          title: 'Data Dipulihkan!',
          text: res.message,
          customClass: { popup: 'swal2-modern-card' }
        });
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: err.toString(),
          customClass: { popup: 'swal2-modern-card' }
        });
      }
    },

    downloadFullBackupJSON() {
      const backupData = {
        appName: 'DompetKu',
        exportDate: new Date().toISOString(),
        wallets: this.wallets,
        accounts: this.allAccounts,
        transactions: this.allTransactions,
        transfers: this.allTransfers,
        categories: this.allCategories,
        users: this.users,
        settings: this.settings,
        archivesList: this.archivesList
      };
      const jsonStr = JSON.stringify(backupData, null, 2);
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      this.downloadBlob(jsonStr, `DompetKu_FullBackup_${dateStr}.json`, 'application/json');
      
      Swal.fire({
        icon: 'success',
        title: 'Cadangan Terunduh!',
        text: 'File JSON cadangan lengkap berhasil disimpan.',
        timer: 2000,
        showConfirmButton: false,
        customClass: { popup: 'swal2-modern-card' }
      });
    },

    downloadActiveTransactionsCSV() {
      this.exportTransactionsToCSV(this.allTransactions, 'DompetKu_Transaksi_Aktif');
    },

    async downloadArchiveCSV(year) {
      const y = Number(year);
      let txns = [];
      if (this.archiveData && this.archiveData.year === y) {
        txns = this.archiveData.transactions || [];
      } else {
        const res = await runApi('getArchiveData', [y]);
        if (res && res.success && res.transactions) {
          txns = res.transactions;
        } else {
          const stored = localStorage.getItem('DOMPETKU_ARCHIVES');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed[y]) txns = parsed[y].transactions || [];
          }
        }
      }
      this.exportTransactionsToCSV(txns, `DompetKu_Arsip_${y}`);
    },

    exportTransactionsToCSV(txnsList, filenamePrefix) {
      if (!txnsList || txnsList.length === 0) {
        Swal.fire({
          icon: 'info',
          title: 'Data Kosong',
          text: 'Tidak ada data transaksi untuk diekspor.',
          customClass: { popup: 'swal2-modern-card' }
        });
        return;
      }
      
      const headers = ['TransactionID', 'Dompet', 'Tanggal', 'Tipe', 'Akun', 'Kategori', 'Nominal', 'Deskripsi', 'Kasir'];
      const rows = [headers.join(',')];

      txnsList.forEach(t => {
        const w = this.wallets.find(item => item.WalletID === t.WalletID)?.NamaDompet || t.WalletID || '-';
        const a = this.allAccounts.find(item => item.AccountID === t.AccountID)?.NamaAkun || t.AccountID || '-';
        const c = this.allCategories.find(item => item.CategoryID === t.CategoryID)?.NamaKategori || t.CategoryID || '-';
        const row = [
          `"${t.TransactionID || ''}"`,
          `"${w}"`,
          `"${t.Tanggal || ''}"`,
          `"${t.TipeTransaksi || ''}"`,
          `"${a}"`,
          `"${c}"`,
          t.Nominal || 0,
          `"${(t.Deskripsi || '').replace(/"/g, '""')}"`,
          `"${t.KasirUsername || ''}"`
        ];
        rows.push(row.join(','));
      });

      const csvContent = '\uFEFF' + rows.join('\r\n');
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      this.downloadBlob(csvContent, `${filenamePrefix}_${dateStr}.csv`, 'text/csv;charset=utf-8;');
      
      Swal.fire({
        icon: 'success',
        title: 'CSV Berhasil Diunduh!',
        text: 'File CSV berhasil dibuat dan siap dibuka di Microsoft Excel.',
        timer: 2000,
        showConfirmButton: false,
        customClass: { popup: 'swal2-modern-card' }
      });
    },

    downloadBlob(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },

    // ================= LAPORAN KEUANGAN METHODS =================
    openReportsTab() {
      this.activeTab = 'reports';
      this.isSidebarOpen = false;
      this.showUserDropdown = false;
      this.syncReportFiltersWithActive();
    },

    syncReportFiltersWithActive() {
      // Sinkronkan bulan & tahun laporan ke filter aktif aplikasi saat ini
      this.reportSelectedMonth = this.selectedMonth;
      this.reportSelectedYear = this.selectedYear;
      
      // Amankan dompet laporan: jika bukan superadmin, hanya izinkan dompet milik user
      if (!this.canAccessWallet(this.reportWalletId) || (this.reportWalletId === 'ALL' && !this.isSuperAdmin)) {
        this.reportWalletId = 'CURRENT';
      }
    },

    // ================= CATATAN LABA BULANAN METHODS =================
    openMonthlyProfitModal(targetMonth = null, targetYear = null) {
      const m = targetMonth !== null ? Number(targetMonth) : this.reportSelectedMonth;
      const y = targetYear !== null ? Number(targetYear) : this.reportSelectedYear;
      const wId = this.reportEffectiveWalletId !== 'ALL' ? this.reportEffectiveWalletId : (this.activeWalletId || 'WLT-1');

      const existing = this.monthlyProfits.find(p => 
        (p.walletId === wId || p.walletId === '*') && p.month === m && p.year === y
      );

      if (existing) {
        this.monthlyProfitForm = {
          id: existing.id,
          walletId: existing.walletId,
          month: existing.month,
          year: existing.year,
          nominal: existing.nominal,
          catatan: existing.catatan || ''
        };
      } else {
        this.monthlyProfitForm = {
          id: '',
          walletId: wId,
          month: m,
          year: y,
          nominal: '',
          catatan: ''
        };
      }
      this.showMonthlyProfitModal = true;
    },

    async saveMonthlyProfit() {
      const form = this.monthlyProfitForm;
      const nominal = Number(form.nominal);
      if (isNaN(nominal) || nominal < 0) {
        Swal.fire({
          icon: 'warning',
          title: 'Nominal Tidak Valid',
          text: 'Nominal laba harus berupa angka yang valid (0 atau lebih).'
        });
        return;
      }

      this.isLoading = true;
      try {
        const m = Number(form.month);
        const y = Number(form.year);
        const wId = form.walletId || 'WLT-1';
        const nowFormatted = new Date().toLocaleDateString('id-ID') + ' ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        const idx = this.monthlyProfits.findIndex(p => 
          (form.id && p.id === form.id) || (p.walletId === wId && p.month === m && p.year === y)
        );

        const profitItem = {
          id: form.id || ('PRF-' + new Date().getTime()),
          walletId: wId,
          month: m,
          year: y,
          nominal: nominal,
          catatan: (form.catatan || '').trim(),
          updatedAt: nowFormatted
        };

        if (idx !== -1) {
          this.monthlyProfits[idx] = profitItem;
        } else {
          this.monthlyProfits.push(profitItem);
        }

        this.saveLocalData();
        this.showMonthlyProfitModal = false;

        Swal.fire({
          icon: 'success',
          title: 'Laba Bulanan Disimpan!',
          text: `Catatan laba ${this.monthNames[m]} ${y} sebesar ${this.formatRupiah(nominal)} berhasil ditarik ke laporan operasional.`,
          timer: 1800,
          showConfirmButton: false,
          customClass: { popup: 'swal2-modern-card' }
        });

        if (this.backendStatus === 'connected') {
          try {
            await runApi('saveSettings', [{ MONTHLY_PROFITS: JSON.stringify(this.monthlyProfits) }]);
          } catch (e) {
            console.warn('Gagal sync ke cloud settings, tersimpan lokal:', e);
          }
        }
      } finally {
        this.isLoading = false;
      }
    },

    async deleteMonthlyProfit(id) {
      const confirm = await Swal.fire({
        icon: 'warning',
        title: 'Hapus Catatan Laba?',
        text: 'Catatan laba bulanan ini akan dihapus dari sistem dan laporan.',
        showCancelButton: true,
        confirmButtonText: 'Ya, Hapus',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#e11d48'
      });
      if (!confirm.isConfirmed) return;

      this.monthlyProfits = this.monthlyProfits.filter(p => p.id !== id);
      this.saveLocalData();

      Swal.fire({
        icon: 'success',
        title: 'Dihapus',
        text: 'Catatan laba bulanan berhasil dihapus.',
        timer: 1500,
        showConfirmButton: false,
        customClass: { popup: 'swal2-modern-card' }
      });

      if (this.backendStatus === 'connected') {
        try {
          await runApi('saveSettings', [{ MONTHLY_PROFITS: JSON.stringify(this.monthlyProfits) }]);
        } catch (e) {}
      }
    },

    editMonthlyProfitItem(item) {
      this.monthlyProfitForm = {
        id: item.id,
        walletId: item.walletId,
        month: item.month,
        year: item.year,
        nominal: item.nominal,
        catatan: item.catatan || ''
      };
    },

    // ===== METODE PENGATURAN KATEGORI LAPORAN OPERASIONAL =====
    isReportCategorySelected(catId) {
      return this.effectiveReportOperationalCategoryIds.includes(catId);
    },

    toggleReportCategory(catId) {
      let current = [...this.effectiveReportOperationalCategoryIds];
      const idx = current.indexOf(catId);
      if (idx >= 0) {
        current.splice(idx, 1);
      } else {
        current.push(catId);
      }
      this.reportSelectedCategoryIds = current;
      this.saveLocalData();
    },

    selectStandardOperationalCategories() {
      const keywords = ['operasional', 'gaji', 'admin', 'bagi hasil'];
      const matched = this.reportAvailableExpenseCategories.filter(cat => {
        const name = (cat.NamaKategori || '').toLowerCase();
        return keywords.some(k => name.includes(k));
      });
      this.reportSelectedCategoryIds = matched.map(c => c.CategoryID);
      this.saveLocalData();
    },

    selectAllReportCategories() {
      this.reportSelectedCategoryIds = this.reportAvailableExpenseCategories.map(c => c.CategoryID);
      this.saveLocalData();
    },

    clearAllReportCategories() {
      this.reportSelectedCategoryIds = [];
      this.saveLocalData();
    },

    getCategoryExpenseInCurrentPeriod(catId) {
      return this.reportFilteredTransactions
        .filter(t => t.TipeTransaksi === 'PENGELUARAN' && t.CategoryID === catId)
        .reduce((sum, t) => sum + (Number(t.Nominal) || 0), 0);
    },

    async saveReportCategorySettings() {
      this.isLoading = true;
      try {
        this.saveLocalData();
        try {
          localStorage.setItem('DOMPETKU_REPORT_SELECTED_CATS', JSON.stringify(this.reportSelectedCategoryIds));
          if (this.backendStatus === 'connected') {
            await runApi('saveSettings', [{ REPORT_SELECTED_CATEGORIES: JSON.stringify(this.reportSelectedCategoryIds) }]);
          }
        } catch (e) {}
        this.showReportCategoryModal = false;
        Swal.fire({
          icon: 'success',
          title: 'Pengaturan Kategori Disimpan!',
          text: `${this.effectiveReportOperationalCategoryIds.length} kategori pengeluaran aktif diterapkan ke Laporan Operasional.`,
          timer: 1800,
          showConfirmButton: false
        });
      } finally {
        this.isLoading = false;
      }
    },

    // ===== METODE PENGATURAN BAGI HASIL =====
    openProfitSharingModal() {
      const curNominal = this.reportProfitSharingNominal;
      const historyNominal = this.reportExpenseBagiHasilNominal;
      const existingShares = (this.profitSharingConfig?.shares && this.profitSharingConfig.shares.length > 0)
        ? JSON.parse(JSON.stringify(this.profitSharingConfig.shares))
        : [
            { id: 'share-1', name: 'Pihak 1 (Pengelola)', percent: 60 },
            { id: 'share-2', name: 'Pihak 2 (Investor)', percent: 40 }
          ];

      const key = this.reportProfitSharingKey;
      const curMode = this.profitSharingConfig?.modeByPeriod?.[key] || (historyNominal > 0 ? 'auto' : 'manual');

      this.profitSharingForm = {
        nominal: curNominal,
        mode: curMode,
        shares: existingShares
      };
      this.showProfitSharingModal = true;
    },

    addProfitSharingParty() {
      const newNo = this.profitSharingForm.shares.length + 1;
      this.profitSharingForm.shares.push({
        id: 'share-' + Date.now(),
        name: `Pihak ${newNo} (Mitra)`,
        percent: 0
      });
    },

    removeProfitSharingParty(idx) {
      if (this.profitSharingForm.shares.length <= 1) return;
      this.profitSharingForm.shares.splice(idx, 1);
    },

    setProfitSharingPreset(type) {
      if (type === '60_40') {
        this.profitSharingForm.shares = [
          { id: 'share-1', name: 'Pihak 1 (Pengelola)', percent: 60 },
          { id: 'share-2', name: 'Pihak 2 (Investor)', percent: 40 }
        ];
      } else if (type === '50_50') {
        this.profitSharingForm.shares = [
          { id: 'share-1', name: 'Pihak 1 (Pengelola)', percent: 50 },
          { id: 'share-2', name: 'Pihak 2 (Investor)', percent: 50 }
        ];
      } else if (type === '70_30') {
        this.profitSharingForm.shares = [
          { id: 'share-1', name: 'Pihak 1 (Pengelola)', percent: 70 },
          { id: 'share-2', name: 'Pihak 2 (Investor)', percent: 30 }
        ];
      }
    },

    setProfitSharingNominalPreset(amount) {
      if (amount === 'history') {
        this.profitSharingForm.mode = 'auto';
        this.profitSharingForm.nominal = this.reportExpenseBagiHasilNominal;
      } else if (amount === 'net_profit') {
        this.profitSharingForm.mode = 'manual';
        this.profitSharingForm.nominal = Math.max(0, this.reportOperationalNetProfit);
      } else {
        this.profitSharingForm.mode = 'manual';
        this.profitSharingForm.nominal = Number(amount) || 0;
      }
    },

    async saveProfitSharingSettings() {
      this.isLoading = true;
      try {
        const key = this.reportProfitSharingKey;
        if (!this.profitSharingConfig) {
          this.profitSharingConfig = { isEnabled: true, defaultNominal: 14000000, modeByPeriod: {}, periodNominals: {}, shares: [] };
        }
        if (!this.profitSharingConfig.periodNominals) {
          this.profitSharingConfig.periodNominals = {};
        }
        if (!this.profitSharingConfig.modeByPeriod) {
          this.profitSharingConfig.modeByPeriod = {};
        }
        
        const nom = Number(this.profitSharingForm.nominal) || 0;
        this.profitSharingConfig.periodNominals[key] = nom;
        this.profitSharingConfig.defaultNominal = nom;
        this.profitSharingConfig.modeByPeriod[key] = this.profitSharingForm.mode || 'auto';
        this.profitSharingConfig.shares = JSON.parse(JSON.stringify(this.profitSharingForm.shares));

        this.saveLocalData();
        try {
          localStorage.setItem('DOMPETKU_PROFIT_SHARING_CONFIG', JSON.stringify(this.profitSharingConfig));
          if (this.backendStatus === 'connected') {
            await runApi('saveSettings', [{ PROFIT_SHARING_CONFIG: JSON.stringify(this.profitSharingConfig) }]);
          }
        } catch (e) {}

        this.showProfitSharingModal = false;
        const isAuto = this.isReportProfitSharingFromHistory;
        Swal.fire({
          icon: 'success',
          title: 'Pengaturan Bagi Hasil Disimpan!',
          text: `Nominal ${this.formatRupiah(this.reportProfitSharingNominal)} ${isAuto ? '(otomatis dari riwayat pengeluaran)' : ''} dengan pembagian ${this.profitSharingConfig.shares.map(s => s.percent + '%').join(' : ')} berhasil diterapkan.`,
          timer: 1800,
          showConfirmButton: false
        });
      } finally {
        this.isLoading = false;
      }
    },

    openPrintPreview() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const randomSuffix = Math.floor(1000 + Math.random() * 9000);
      const prefix = this.reportType === 'operasional' ? 'RPT-OPS' : 'RPT-KMP';
      this.printDocumentNumber = `${prefix}-${now.getFullYear()}${pad(now.getMonth() + 1)}-${randomSuffix}`;
      
      const options = { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      };
      this.printGeneratedDate = now.toLocaleDateString('id-ID', options) + ' WIB';
      this.applyPrintOrientation(this.printOrientation || 'portrait');
      this.showPrintPreviewModal = true;
    },

    printReport() {
      this.openPrintPreview();
    },

    printReportDirect() {
      this.openPrintPreview();
      const originalTitle = document.title;
      document.title = this.reportPdfFileName;
      
      const doPrint = () => {
        this.executePrint();
      };

      if (typeof this.$nextTick === 'function') {
        this.$nextTick(() => {
          setTimeout(doPrint, 150);
        });
      } else {
        setTimeout(doPrint, 180);
      }
    },

    async saveReportPDF() {
      this.openPrintPreview();
      const filename = this.reportPdfFileName + '.pdf';
      const originalTitle = document.title;
      document.title = this.reportPdfFileName;

      // Tunggu hingga rendering DOM lembar cetak stabil
      await new Promise(r => setTimeout(r, 220));

      if (window.html2pdf) {
        const sheet = document.getElementById('print-document-sheet');
        if (!sheet) {
          this.executePrint();
          setTimeout(() => { document.title = originalTitle; }, 3000);
          return;
        }

        this.isGeneratingPdf = true;
        sheet.classList.add('is-generating-pdf');
        const isLandscape = this.printOrientation === 'landscape';
        if (isLandscape) {
          sheet.classList.add('is-pdf-landscape');
          sheet.classList.remove('is-pdf-portrait');
        } else {
          sheet.classList.add('is-pdf-portrait');
          sheet.classList.remove('is-pdf-landscape');
        }

        const opt = {
          margin: [6, 8, 8, 8],
          filename: filename,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { 
            scale: 2, 
            useCORS: true, 
            logging: false,
            letterRendering: true,
            scrollX: 0,
            scrollY: 0,
            windowWidth: isLandscape ? 1200 : 860
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: isLandscape ? 'landscape' : 'portrait' },
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        try {
          await html2pdf().set(opt).from(sheet).save();
          Swal.fire({
            icon: 'success',
            title: 'PDF Berhasil Disimpan!',
            text: `File "${filename}" berhasil diunduh ke perangkat Anda.`,
            timer: 2000,
            showConfirmButton: false
          });
        } catch (err) {
          console.warn('html2pdf fallback to window.print', err);
          this.executePrint();
        } finally {
          sheet.classList.remove('is-generating-pdf', 'is-pdf-portrait', 'is-pdf-landscape');
          this.isGeneratingPdf = false;
          setTimeout(() => { document.title = originalTitle; }, 3000);
        }
      } else {
        this.executePrint();
        setTimeout(() => { document.title = originalTitle; }, 3000);
      }
    },

    downloadSheetPDF() {
      this.saveReportPDF();
    },

    setPrintOrientation(orientation) {
      this.printOrientation = orientation;
      this.applyPrintOrientation(orientation);
    },

    applyPrintOrientation(orientation) {
      let styleEl = document.getElementById('print-page-orientation-style');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'print-page-orientation-style';
        document.head.appendChild(styleEl);
      }
      if (orientation === 'landscape') {
        styleEl.innerHTML = '@media print { @page { size: A4 landscape !important; margin: 8mm 10mm 10mm 10mm !important; } }';
        document.body.classList.add('print-orientation-landscape');
      } else {
        styleEl.innerHTML = '@media print { @page { size: A4 portrait !important; margin: 10mm 12mm 12mm 12mm !important; } }';
        document.body.classList.remove('print-orientation-landscape');
      }
    },

    executePrint() {
      this.applyPrintOrientation(this.printOrientation || 'portrait');
      document.body.classList.add('is-printing-report');
      const originalTitle = document.title;
      document.title = this.reportPdfFileName;
      
      setTimeout(() => {
        window.print();
        setTimeout(() => {
          document.body.classList.remove('is-printing-report');
          document.title = originalTitle;
        }, 1500);
      }, 150);
    },

    closePrintPreview() {
      this.showPrintPreviewModal = false;
      document.body.classList.remove('is-printing-report');
    },

    exportReportCSV() {
      const lines = [];
      lines.push(`LAPORAN KEUANGAN DOMPETKU`);
      lines.push(`Dompet:,"${this.reportWalletName}"`);
      lines.push(`Tipe Laporan:,"${this.reportType === 'operasional' ? 'Laporan Operasional' : 'Laporan Seluruh Keuangan (Komprehensif)'}"`);
      lines.push(`Periode:,"${this.reportPeriodLabel}"`);
      lines.push(`Tanggal Dibuat:,"${new Date().toLocaleString('id-ID')}"`);
      lines.push(``);
      lines.push(`RINGKASAN EKSEKUTIF`);
      lines.push(`Total Pemasukan,${this.reportTotalIncome}`);
      lines.push(`Total Pengeluaran,${this.reportTotalExpense}`);
      if (this.reportType === 'operasional') {
        const catNames = this.effectiveReportOperationalCategoryIds.map(id => this.allCategories.find(c => c.CategoryID === id)?.NamaKategori || id).join('; ');
        lines.push(`Kategori Pemotong Terpilih,,"${catNames}"`);
        lines.push(`Total Beban Kategori Terpilih,${this.reportOperationalTotalExpense}`);
        if (this.hasReportMonthlyProfit) {
          lines.push(`Catatan Laba Bulanan (Diinput),${this.reportTotalMonthlyProfitInput}`);
        }
        lines.push(`Laba Bersih Operasional (Laba - Kategori Terpilih),${this.reportOperationalNetProfit}`);
        lines.push(`Laba Bagi Hasil,${this.reportProfitSharingNominal}`);
        lines.push(`Total Sisa Laba (Laba Bersih - Bagi Hasil),${this.reportRemainingProfit}`);
        lines.push(``);
        lines.push(`PERHITUNGAN BAGI HASIL`);
        lines.push(`No,Pihak,Persen,Nominal`);
        this.reportProfitSharingDistribution.forEach(s => {
          lines.push(`${s.no},"${s.name}","${s.percent}%",${s.nominal}`);
        });
      }
      lines.push(`Surplus / Defisit Bersih,${this.reportNetSurplus}`);
      lines.push(`Volume Pindah Dana,${this.reportTotalTransfers}`);
      lines.push(`Total Posisi Kas,${this.reportTotalBalance}`);
      lines.push(``);
      lines.push(`RINCIAN PER KATEGORI`);
      lines.push(`Kategori,Tipe,Jumlah Transaksi,Total Nominal,Persentase`);
      this.reportCategoryBreakdown.forEach(c => {
        lines.push(`"${c.nama}","${c.tipe}",${c.count},${c.total},"${c.percent}%"`);
      });
      lines.push(``);
      lines.push(`POSISI SALDO & ARUS REKENING`);
      lines.push(`Akun Rekening,Tipe,Total Masuk,Total Keluar,Arus Bersih,Saldo Terkini`);
      this.reportAccountBreakdown.forEach(a => {
        lines.push(`"${a.namaAkun}","${a.tipeAkun}",${a.totalMasuk},${a.totalKeluar},${a.netFlow},${a.saldoSekarang}`);
      });
      lines.push(``);
      lines.push(`RINCIAN TRANSAKSI`);
      lines.push(`TransactionID,Tanggal,Tipe,Akun,Kategori,Nominal,Deskripsi,Kasir`);
      this.reportFilteredTransactions.forEach(t => {
        const a = this.allAccounts.find(item => item.AccountID === t.AccountID)?.NamaAkun || t.AccountID || '-';
        const c = this.allCategories.find(item => item.CategoryID === t.CategoryID)?.NamaKategori || t.CategoryID || '-';
        lines.push(`"${t.TransactionID}","${this.formatDateOnly(t.Tanggal)}","${t.TipeTransaksi}","${a}","${c}",${t.Nominal},"${(t.Deskripsi || '').replace(/"/g, '""')}","${t.KasirUsername || ''}"`);
      });

      const csvContent = '\uFEFF' + lines.join('\r\n');
      const filename = `Laporan_${this.reportType}_${this.reportWalletName.replace(/[^a-zA-Z0-9]/g, '_')}_${this.reportPeriodLabel.replace(/[^a-zA-Z0-9]/g, '_')}.csv`;
      this.downloadBlob(csvContent, filename, 'text/csv;charset=utf-8;');

      Swal.fire({
        icon: 'success',
        title: 'Laporan Diunduh!',
        text: 'File CSV laporan lengkap berhasil diunduh.',
        timer: 1800,
        showConfirmButton: false,
        customClass: { popup: 'swal2-modern-card' }
      });
    }
  };
}
</script>
