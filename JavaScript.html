const DEV_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz_j96H7_A7moGhVgA0sRf859LZRd7qMGWTvzkV63QpWTNL8t1_xB9novW0-XURJB_x/exec';

// Helper API Caller
async function runApi(action, args = []) {
  // Jika di dalam Google Apps Script runtime
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[action](...args);
    });
  }

  // Jika Web App URL masih placeholder, gunakan local fallback
  const targetUrl = WEB_APP_URLS[0];
  if (!targetUrl || targetUrl.includes('PROD_WEB_APP_URL_HERE')) {
    return { localOnly: true };
  }

  // Fetch via HTTP POST ke Apps Script
  const response = await fetch(targetUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, args })
  });
  return await response.json();
}

// =========================================================================
// SETUP GLOBAL SWEETALERT2 MODERN FORMATTER
// Menyeragamkan seluruh popup notifikasi, validasi & konfirmasi di aplikasi
// dengan estetika kartu modern, glowing ambient blur & tombol gradient
// persis seperti modal Logout dan Login Berhasil.
// =========================================================================
(function setupModernSwal() {
  if (typeof window === 'undefined') return;

  function initSwalWrapper() {
    if (!window.Swal || window.Swal.__isModernConfigured) return;
    window.Swal.__isModernConfigured = true;

    const originalFire = window.Swal.fire.bind(window.Swal);

    window.Swal.fire = function(...args) {
      let opts = {};
      if (typeof args[0] === 'string') {
        opts.title = args[0];
        if (typeof args[1] === 'string') opts.text = args[1];
        if (typeof args[2] === 'string') opts.icon = args[2];
      } else if (typeof args[0] === 'object' && args[0] !== null) {
        opts = { ...args[0] };
      }

      const isDark = document.documentElement.classList.contains('dark') || 
                     localStorage.getItem('DOMPETKU_THEME') === 'dark';

      // Deteksi tipe ikon & konteks aksi
      const rawIcon = opts.icon || (opts.showCancelButton ? 'question' : 'info');
      const titleText = opts.title || '';
      const bodyText = opts.text || '';
      
      // Deteksi aksi destruktif / hapus / keluar
      const isDeleteOrDanger = /hapus|delete|buang|keluar/i.test(titleText) ||
                               /hapus|delete|buang|keluar/i.test(opts.confirmButtonText || '') ||
                               rawIcon === 'error';

      // Konfigurasi visual matching Logout & Login Berhasil
      let tag = 'INFORMASI';
      let tagColor = 'text-blue-600 dark:text-blue-400';
      let glow = 'bg-blue-500/20 dark:bg-blue-500/30';
      let gradient = 'bg-gradient-to-tr from-blue-600 to-indigo-500';
      let shadow = 'shadow-blue-500/30';
      let iconClass = 'fa-circle-info';
      let confirmGradient = 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white shadow-blue-500/25';

      if (isDeleteOrDanger) {
        tag = /hapus/i.test(titleText) ? 'KONFIRMASI HAPUS' : (rawIcon === 'error' ? 'PERINGATAN' : 'KONFIRMASI');
        tagColor = 'text-rose-600 dark:text-rose-400';
        glow = 'bg-rose-500/20 dark:bg-rose-500/30';
        gradient = 'bg-gradient-to-tr from-rose-600 to-rose-500';
        shadow = 'shadow-rose-500/30';
        iconClass = /hapus/i.test(titleText) ? 'fa-trash-can' : 'fa-circle-xmark';
        confirmGradient = 'bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-700 hover:to-rose-600 text-white shadow-rose-500/25';
      } else if (rawIcon === 'success') {
        tag = 'BERHASIL';
        tagColor = 'text-emerald-600 dark:text-emerald-400';
        glow = 'bg-emerald-500/20 dark:bg-emerald-500/30';
        gradient = 'bg-gradient-to-tr from-emerald-600 to-teal-500';
        shadow = 'shadow-emerald-500/30';
        iconClass = 'fa-circle-check';
        confirmGradient = 'bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white shadow-emerald-500/25';
      } else if (rawIcon === 'warning') {
        tag = opts.showCancelButton ? 'KONFIRMASI' : 'PERHATIAN';
        tagColor = 'text-amber-600 dark:text-amber-400';
        glow = 'bg-amber-500/20 dark:bg-amber-500/30';
        gradient = 'bg-gradient-to-tr from-amber-500 to-orange-500';
        shadow = 'shadow-amber-500/30';
        iconClass = 'fa-triangle-exclamation';
        confirmGradient = 'bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white shadow-amber-500/25';
      } else if (rawIcon === 'question') {
        tag = 'KONFIRMASI';
        tagColor = 'text-violet-600 dark:text-violet-400';
        glow = 'bg-violet-500/20 dark:bg-violet-500/30';
        gradient = 'bg-gradient-to-tr from-violet-600 to-purple-600';
        shadow = 'shadow-violet-500/30';
        iconClass = 'fa-circle-question';
        confirmGradient = 'bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white shadow-violet-500/25';
      }

      // Format Toast Notifikasi Modern (mencegah lingkaran kosong bawaan SweetAlert2)
      const isToast = Boolean(opts.toast || (this && this.params && this.params.toast));
      if (isToast) {
        if (!opts.html) {
          opts.html = `
            <div class="flex items-center gap-3 py-1 text-left w-full">
              <div class="w-8 h-8 rounded-xl ${gradient} text-white flex items-center justify-center text-sm shadow-md shrink-0">
                <i class="fa-solid ${iconClass}"></i>
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-xs font-bold text-slate-900 dark:text-white leading-snug">${titleText}</div>
                ${bodyText ? `<div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 leading-tight">${bodyText}</div>` : ''}
              </div>
            </div>
          `;
        }
        delete opts.icon;
        delete opts.title;
        delete opts.text;
        opts.buttonsStyling = false;
        opts.background = isDark ? '#0f172a' : '#ffffff';
        opts.customClass = {
          popup: 'rounded-2xl p-3 shadow-xl border border-slate-200/90 dark:border-slate-800/90 backdrop-blur-xl font-sans',
          ...(opts.customClass || {})
        };
        return originalFire(opts);
      }

      // Format HTML modern jika belum disediakan oleh pemanggil
      if (!opts.html) {
        opts.html = `
          <div class="p-2 sm:p-3 text-center space-y-3">
            <div class="relative mx-auto w-16 h-16 flex items-center justify-center">
              <div class="absolute inset-0 rounded-2xl ${glow} blur-xl"></div>
              <div class="relative w-16 h-16 rounded-2xl ${gradient} text-white flex items-center justify-center text-2xl shadow-lg ${shadow}">
                <i class="fa-solid ${iconClass}"></i>
              </div>
            </div>
            <div>
              <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider ${tagColor} block">${tag}</span>
              <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white mt-1 leading-snug">${titleText}</h3>
              ${bodyText ? `<p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">${bodyText}</p>` : ''}
            </div>
          </div>
        `;
      }

      // Bersihkan properti bawaan SweetAlert2 yang digantikan HTML modern
      delete opts.icon;
      delete opts.title;
      delete opts.text;
      delete opts.confirmButtonColor;
      delete opts.cancelButtonColor;

      opts.buttonsStyling = false;
      opts.background = isDark ? '#0f172a' : '#ffffff';

      // Jika showConfirmButton eksplisit false atau timer tanpa confirm button
      if (opts.showConfirmButton === false || (opts.timer && opts.showConfirmButton !== true)) {
        opts.showConfirmButton = false;
      } else {
        opts.confirmButtonText = opts.confirmButtonText || (opts.showCancelButton ? 'Lanjutkan' : 'Oke, Paham');
      }
      opts.cancelButtonText = opts.cancelButtonText || 'Batal';

      const defaultCustomClass = {
        popup: 'rounded-3xl p-5 sm:p-6 shadow-2xl border border-slate-200/90 dark:border-slate-800/90 backdrop-blur-2xl max-w-sm w-full font-sans',
        actions: opts.showCancelButton ? 'grid grid-cols-2 gap-3 pt-2 w-full' : 'flex justify-center items-center pt-2 w-full',
        confirmButton: opts.showCancelButton
          ? `w-full py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold active:scale-98 transition-all cursor-pointer shadow-md ${confirmGradient}`
          : `w-full max-w-xs mx-auto py-2.5 px-6 rounded-xl text-xs sm:text-sm font-bold active:scale-98 transition-all cursor-pointer shadow-md ${confirmGradient}`,
        cancelButton: 'w-full py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-xs sm:text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-98 transition-all cursor-pointer'
      };

      opts.customClass = {
        ...defaultCustomClass,
        ...(opts.customClass || {})
      };

      return originalFire(opts);
    };
  }

  if (window.Swal) {
    initSwalWrapper();
  } else {
    document.addEventListener('DOMContentLoaded', initSwalWrapper);
  }
})();

    // INISIALISASI DATA LOCALSTORAGE
    loadLocalData() {
      const stored = localStorage.getItem(CACHE_KEY);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          this.wallets = parsed.wallets || [];
          this.users = parsed.users || [];
          this.allAccounts = parsed.allAccounts || parsed.accounts || [];
          this.allTransactions = parsed.allTransactions || parsed.transactions || [];
          this.allTransfers = parsed.allTransfers || parsed.transfers || [];
          this.allCategories = parsed.allCategories || parsed.categories || [];
          this.settings = parsed.settings || {};
          this.monthlyProfits = parsed.monthlyProfits || [];
          this.reportSelectedCategoryIds = parsed.reportSelectedCategoryIds || [];
          if (!this.reportSelectedCategoryIds || this.reportSelectedCategoryIds.length === 0) {
            try {
              const savedCats = localStorage.getItem('DOMPETKU_REPORT_SELECTED_CATS');
              if (savedCats) this.reportSelectedCategoryIds = JSON.parse(savedCats);
            } catch (e) {}
          }

          // Pastikan kategori operasional baku sistem (Operasional, Bagi Hasil, Admin Bank) tersedia di seluruh dompet
          this.ensureAllWalletsSystemCategories();
          this.syncTransferAdminTransactions();

          if ((!this.monthlyProfits || this.monthlyProfits.length === 0) && this.settings) {
            try {
              let raw = null;
              if (Array.isArray(this.settings)) {
                const found = this.settings.find(s => s.SettingKey === 'MONTHLY_PROFITS');
                if (found) raw = found.SettingValue;
              } else if (this.settings.MONTHLY_PROFITS) {
                raw = this.settings.MONTHLY_PROFITS;
              }
              if (raw) {
                this.monthlyProfits = typeof raw === 'string' ? JSON.parse(raw) : raw;
              }
            } catch (e) {}
          }

          // Muat konfigurasi bagi hasil dari local storage atau settings
          try {
            const savedSharing = localStorage.getItem('DOMPETKU_PROFIT_SHARING_CONFIG');
            if (savedSharing) {
              this.profitSharingConfig = JSON.parse(savedSharing);
            } else if (parsed && parsed.profitSharingConfig) {
              this.profitSharingConfig = parsed.profitSharingConfig;
            } else if (this.settings) {
              let rawSharing = null;
              if (Array.isArray(this.settings)) {
                const foundSharing = this.settings.find(s => s.SettingKey === 'PROFIT_SHARING_CONFIG');
                if (foundSharing) rawSharing = foundSharing.SettingValue;
              } else if (this.settings.PROFIT_SHARING_CONFIG) {
                rawSharing = this.settings.PROFIT_SHARING_CONFIG;
              }
              if (rawSharing) {
                this.profitSharingConfig = typeof rawSharing === 'string' ? JSON.parse(rawSharing) : rawSharing;
              }
            }
          } catch (e) {}

          if (!this.monthlyProfits || this.monthlyProfits.length === 0) {
            this.seedDefaultMonthlyProfits();
          }

          // Pastikan data memiliki WalletID jika migrasi dari versi lama
          this.allAccounts.forEach(a => { if (!a.WalletID) a.WalletID = 'WLT-1'; });
          this.allTransactions.forEach(t => { if (!t.WalletID) t.WalletID = 'WLT-1'; });
          this.allTransfers.forEach(tr => { if (!tr.WalletID) tr.WalletID = 'WLT-1'; });
          this.allCategories.forEach(c => { if (!c.WalletID) c.WalletID = '*'; });

          if (this.wallets.length === 0) {
            this.seedDefaultWallets();
          }
          if (this.users.length === 0) {
            this.seedDefaultUsers();
          }

          this.ensureAllWalletsSystemCategories();
          this.syncTransferAdminTransactions();
          return;
        } catch (e) {
          console.error('Error parse local storage', e);
        }
      }

      // Default Seed Data Lengkap (Multi-Dompet & Multi-User)
      this.seedDefaultWallets();
      this.seedDefaultUsers();
      this.seedDefaultFinancialData();
      this.ensureAllWalletsSystemCategories();
      this.syncTransferAdminTransactions();
    },

    // ===== SYSTEM CATEGORIES (KATEGORI BAKU SISTEM) =====
    isSystemCategory(cat) {
      if (!cat) return false;
      if (String(cat.IsSystem).toUpperCase() === 'TRUE') return true;
      const n = (cat.NamaKategori || '').trim().toLowerCase();
      return n === 'operasional' || n === 'bagi hasil' || n === 'admin bank' ||
             n === 'biaya admin' || n === 'biaya admin bank' || n === 'biaya admin transfer';
    },

    getAdminBankCategory(walletId) {
      const wId = walletId || this.activeWalletId || 'WLT-1';
      let cat = this.allCategories.find(c => {
        if (c.Tipe !== 'PENGELUARAN') return false;
        if (c.WalletID !== wId && c.WalletID !== '*') return false;
        const n = (c.NamaKategori || '').trim().toLowerCase();
        return n === 'admin bank' || n.includes('admin');
      });
      if (!cat) {
        cat = {
          CategoryID: 'CAT-' + wId + '-SYS-ADM',
          WalletID: wId,
          NamaKategori: 'Admin Bank',
          Tipe: 'PENGELUARAN',
          Ikon: 'fa-receipt',
          Warna: '#64748b',
          BudgetBulanan: 100000,
          Urutan: 99,
          IsActive: 'TRUE',
          IsSystem: 'TRUE'
        };
        this.allCategories.push(cat);
        this.saveLocalData();
      }
      return cat;
    },

    ensureWalletSystemCategories(walletId) {
      const wId = walletId || this.activeWalletId || 'WLT-1';
      if (!wId) return;

      const sysDefs = [
        { key: 'operasional', name: 'Operasional', icon: 'fa-briefcase', color: '#0284c7', budget: 1000000 },
        { key: 'bagi_hasil', name: 'Bagi Hasil', icon: 'fa-hand-holding-dollar', color: '#0d9488', budget: 1000000 },
        { key: 'admin_bank', name: 'Admin Bank', icon: 'fa-receipt', color: '#64748b', budget: 100000 }
      ];

      let changed = false;
      sysDefs.forEach((def, idx) => {
        let existing = this.allCategories.find(c => {
          if (c.Tipe !== 'PENGELUARAN') return false;
          if (c.WalletID !== wId && c.WalletID !== '*') return false;
          const n = (c.NamaKategori || '').trim().toLowerCase();
          if (def.key === 'operasional') return n === 'operasional' || n.startsWith('operasional');
          if (def.key === 'bagi_hasil') return n === 'bagi hasil' || n.includes('bagi hasil') || n.includes('dividen') || n.includes('profit sharing');
          if (def.key === 'admin_bank') return n === 'admin bank' || n.includes('admin');
          return false;
        });

        if (existing) {
          existing.IsSystem = 'TRUE';
          if (def.key === 'admin_bank' && existing.NamaKategori !== 'Admin Bank') {
            existing.NamaKategori = 'Admin Bank';
            changed = true;
          } else if (def.key === 'operasional' && (existing.NamaKategori === 'Operasional & Toko' || existing.NamaKategori === 'Operasional & Listrik Toko')) {
            existing.NamaKategori = 'Operasional';
            changed = true;
          } else if (def.key === 'bagi_hasil' && (existing.NamaKategori === 'Bagi Hasil & Dividen' || existing.NamaKategori === 'Bagi Hasil / Dividen' || existing.NamaKategori === 'Bagi Hasil & Investasi')) {
            existing.NamaKategori = 'Bagi Hasil';
            changed = true;
          }
        } else {
          this.allCategories.push({
            CategoryID: `CAT-${wId}-SYS-${def.key.toUpperCase()}`,
            WalletID: wId,
            NamaKategori: def.name,
            Tipe: 'PENGELUARAN',
            Ikon: def.icon,
            Warna: def.color,
            BudgetBulanan: def.budget,
            Urutan: 90 + idx,
            IsActive: 'TRUE',
            IsSystem: 'TRUE'
          });
          changed = true;
        }
      });

      if (changed) {
        this.saveLocalData();
      }
    },

    ensureAllWalletsSystemCategories() {
      const walletList = (this.wallets && this.wallets.length > 0) ? this.wallets : [{ WalletID: 'WLT-1' }, { WalletID: 'WLT-2' }];
      walletList.forEach(w => {
        this.ensureWalletSystemCategories(w.WalletID);
      });
    },

    syncTransferAdminTransactions() {
      if (!this.allTransfers || !Array.isArray(this.allTransfers)) return;
      let updated = false;

      this.allTransfers.forEach(tr => {
        const fee = Number(tr.BiayaAdmin) || 0;
        const admTxnId = 'TXN-ADM-' + tr.TransferID;
        const existingTxn = this.allTransactions.find(t => t.TransactionID === admTxnId);

        if (fee > 0) {
          const wId = tr.WalletID || 'WLT-1';
          const adminCat = this.getAdminBankCategory(wId);
          const catId = adminCat ? adminCat.CategoryID : 'CAT-OUT-7';
          const fromAcc = this.allAccounts.find(a => a.AccountID === tr.FromAccountID);
          const toAcc = this.allAccounts.find(a => a.AccountID === tr.ToAccountID);
          const fromName = fromAcc ? fromAcc.NamaAkun : 'Akun Asal';
          const toName = toAcc ? toAcc.NamaAkun : 'Akun Tujuan';
          const desc = `Biaya Admin Transfer (${fromName} → ${toName})`;

          if (existingTxn) {
            if (Number(existingTxn.Nominal) !== fee || existingTxn.CategoryID !== catId || existingTxn.AccountID !== tr.FromAccountID) {
              existingTxn.Nominal = fee;
              existingTxn.CategoryID = catId;
              existingTxn.AccountID = tr.FromAccountID;
              existingTxn.Tanggal = tr.Tanggal;
              existingTxn.WalletID = wId;
              existingTxn.Deskripsi = desc;
              existingTxn.IsSystem = 'TRUE';
              existingTxn.IsTransferAdmin = true;
              updated = true;
            }
          } else {
            this.allTransactions.push({
              TransactionID: admTxnId,
              WalletID: wId,
              Tanggal: tr.Tanggal,
              TipeTransaksi: 'PENGELUARAN',
              AccountID: tr.FromAccountID,
              CategoryID: catId,
              Nominal: fee,
              Deskripsi: desc,
              BuktiUrl: '',
              KasirUsername: tr.KasirUsername || 'superadmin',
              IsSystem: 'TRUE',
              IsTransferAdmin: true
            });
            updated = true;
          }
        } else if (fee === 0 && existingTxn) {
          this.allTransactions = this.allTransactions.filter(t => t.TransactionID !== admTxnId);
          updated = true;
        }
      });

      if (updated) {
        this.saveLocalData();
      }
    },

          catatan: 'Estimasi Laba Penjualan Toko & Grosir',
          updatedAt: '01/10/2026 10:00'

    },

    saveLocalData() {
      const payload = {
        wallets: this.wallets,
        users: this.users,
        allAccounts: this.allAccounts,
        allTransactions: this.allTransactions,
        allTransfers: this.allTransfers,
        allCategories: this.allCategories,
        settings: this.settings,
        monthlyProfits: this.monthlyProfits,
        reportSelectedCategoryIds: this.reportSelectedCategoryIds,
        profitSharingConfig: this.profitSharingConfig
      };
      localStorage.setItem('DOMPETKU_REPORT_SELECTED_CATS', JSON.stringify(this.reportSelectedCategoryIds));
      localStorage.setItem('DOMPETKU_PROFIT_SHARING_CONFIG', JSON.stringify(this.profitSharingConfig));
      localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
    },

    async syncFromCloud() {
      try {
        const res = await runApi('getAllData', [this.isSuperAdmin || this.isAdminOrSuper]);
        if (res && res.wallets && res.wallets.length > 0) {
          this.wallets = res.wallets;
          if (res.users && res.users.length > 0) {
            this.users = res.users;
          }
          this.allAccounts = res.accounts || [];
          this.allTransactions = res.transactions || [];
          this.allTransfers = res.transfers || [];
          this.allCategories = res.categories || [];
          this.settings = res.settings || {};
          try {
            let raw = null;
            if (Array.isArray(this.settings)) {
              const found = this.settings.find(s => s.SettingKey === 'MONTHLY_PROFITS');
              if (found) raw = found.SettingValue;
            } else if (this.settings.MONTHLY_PROFITS) {
              raw = this.settings.MONTHLY_PROFITS;
            }
            if (raw) {
              this.monthlyProfits = typeof raw === 'string' ? JSON.parse(raw) : raw;
            }
          } catch (e) {}

          try {
            let rawSharing = null;
            if (Array.isArray(this.settings)) {
              const foundSharing = this.settings.find(s => s.SettingKey === 'PROFIT_SHARING_CONFIG');
              if (foundSharing) rawSharing = foundSharing.SettingValue;
            } else if (this.settings.PROFIT_SHARING_CONFIG) {
              rawSharing = this.settings.PROFIT_SHARING_CONFIG;
            }
            if (rawSharing) {
              this.profitSharingConfig = typeof rawSharing === 'string' ? JSON.parse(rawSharing) : rawSharing;
            }
          } catch (e) {}
          this.backendStatus = 'connected';
          
          this.ensureAllWalletsSystemCategories();
          this.syncTransferAdminTransactions();
          this.refreshActiveWalletData();
          this.saveLocalData();
          await this.loadArchiveYears();
        } else {
          this.backendStatus = 'local';
          await this.loadArchiveYears();
        }
      } catch (err) {
        console.warn('Gagal sync backend Apps Script, mode offline aktif:', err);
        this.backendStatus = 'local';
        await this.loadArchiveYears();
      }
    },

    // ================= GETTERS ROLE & OTORISASI =================
    get isSuperAdmin() {
      return this.currentUser && this.currentUser.Role === 'superadmin';
    },

    get isAdminOrSuper() {
      return this.currentUser && (this.currentUser.Role === 'superadmin' || this.currentUser.Role === 'admin');
    },

    get isUserRole() {
      return this.currentUser && this.currentUser.Role === 'user';
    },

    get canManageWallets() {
      return !!this.currentUser;
    },

    get canCreateWallet() {
      return this.isSuperAdmin; // Hanya Super Administrator yang dapat membuat dompet baru
    },

    get canEditWallet() {
      return !!this.currentUser;
    },

    get canDeleteWallet() {
      // Khusus untuk role 'user', tidak boleh hapus dompet
      return this.isAdminOrSuper;
    },

    get canDeleteAccount() {
      // Khusus untuk role 'user', tidak boleh hapus akun
      return this.isAdminOrSuper;
    },

    get canDeleteCategory() {
      // Khusus untuk role 'user', tidak boleh hapus kategori
      return this.isAdminOrSuper;
    },

    get canSwitchProfile() {
      return this.isSuperAdmin;
    },

    get hasMultipleWallets() {
      return this.isSuperAdmin || this.userAccessibleWallets.length > 1;
    },

    canAccessWallet(walletId) {
      if (this.isSuperAdmin) return true;
      if (!this.currentUser || !this.currentUser.AssignedWallets) return false;
      if (this.currentUser.AssignedWallets === '*') return true;
      const allowed = this.currentUser.AssignedWallets.split(',').map(s => s.trim());
      return allowed.includes(walletId);
    },

    get userAccessibleWallets() {
      return this.wallets.filter(w => this.canAccessWallet(w.WalletID));
    },

    get displayedWallets() {
      return this.isSuperAdmin ? this.wallets : this.userAccessibleWallets;
    },

    get activeWallet() {
      return this.wallets.find(w => w.WalletID === this.activeWalletId) || this.wallets[0] || {
        WalletID: 'WLT-1',
        NamaDompet: 'Dompet Utama',
        Ikon: 'fa-wallet',
        Warna: '#059669',
        Deskripsi: ''
      };
    },

    getWalletNetWorth(walletId) {
      return this.allAccounts
        .filter(a => (a.WalletID || 'WLT-1') === walletId && String(a.IsActive).toUpperCase() === 'TRUE')
        .reduce((sum, a) => sum + (Number(a.SaldoSekarang) || 0), 0);
    },

    getWalletAccountCount(walletId) {
      return this.allAccounts.filter(a => (a.WalletID || 'WLT-1') === walletId).length;
    },

    getWalletTxnCount(walletId) {
      return this.allTransactions.filter(t => (t.WalletID || 'WLT-1') === walletId).length;
    },

    // User Management Getters
    get superAdminCount() {
      return this.users.filter(u => u.Role === 'superadmin').length;
    },

    get adminCount() {
      return this.users.filter(u => u.Role === 'admin').length;
    },

    get regularUserCount() {
      return this.users.filter(u => u.Role === 'user').length;
    },

    get activeUserCount() {
      return this.users.filter(u => String(u.IsActive).toUpperCase() === 'TRUE').length;
    },

    get filteredUsers() {
      let list = this.users;
      if (this.userRoleFilter && this.userRoleFilter !== 'ALL') {
        list = list.filter(u => u.Role === this.userRoleFilter);
      }
      if (this.userSearchQuery && this.userSearchQuery.trim() !== '') {
        const q = this.userSearchQuery.toLowerCase();
        list = list.filter(u => 
          (u.FullName && u.FullName.toLowerCase().includes(q)) ||
          (u.Username && u.Username.toLowerCase().includes(q))
        );

    // ================= GETTERS CADANGAN & ARSIP =================
    get availableYearsInActiveData() {
      const yearsSet = new Set();
      const currentY = new Date().getFullYear();
      yearsSet.add(currentY);
      if (this.selectedYear) yearsSet.add(Number(this.selectedYear));
      if (this.reportSelectedYear) yearsSet.add(Number(this.reportSelectedYear));
      this.allTransactions.forEach(t => {
        const y = this.extractYearFromStr(t.Tanggal);
        if (y) yearsSet.add(y);
      });
      this.allTransfers.forEach(tr => {
        const y = this.extractYearFromStr(tr.Tanggal);
        if (y) yearsSet.add(y);
      });
      return Array.from(yearsSet).sort((a, b) => b - a);
    },

    get archiveSummaryForSelectedYear() {
      const y = Number(this.selectedYearToArchive);
      const txnCount = this.allTransactions.filter(t => this.extractYearFromStr(t.Tanggal) === y).length;
      const trfCount = this.allTransfers.filter(tr => this.extractYearFromStr(tr.Tanggal) === y).length;
      return { txnCount, trfCount, year: y };
    },

    // ================= GETTERS LAPORAN KEUANGAN =================
    get reportAccessibleWallets() {
      if (this.isSuperAdmin) {
        return this.wallets;
      }
      return this.userAccessibleWallets;
    },

    get reportEffectiveWalletId() {
      if (this.reportWalletId === 'CURRENT') return this.activeWalletId;
      if (!this.isSuperAdmin) {
        if (this.reportWalletId === 'ALL' || !this.canAccessWallet(this.reportWalletId)) {
          return this.activeWalletId;
        }
      }
      return this.reportWalletId;
    },

    get reportWalletName() {
      const effId = this.reportEffectiveWalletId;
      if (effId === 'ALL' && this.isSuperAdmin) {
        return 'Konsolidasi Seluruh Dompet (*)';
      }
      const found = this.wallets.find(w => w.WalletID === effId);
      return found?.NamaDompet || this.activeWallet?.NamaDompet || 'Dompet Aktif';
    },

    get reportPeriodLabel() {
      if (this.reportPeriodType === 'month') {
        return `${this.monthNames[this.reportSelectedMonth]} ${this.reportSelectedYear}`;
      }
      if (this.reportPeriodType === 'year') {
        return `Tahun ${this.reportSelectedYear} (1 Tahun Penuh)`;
      }
      return 'Seluruh Periode';
    },

    get reportFilteredTransactions() {
      let list = this.allTransactions;

      const wId = this.reportEffectiveWalletId;
      if (wId !== 'ALL') {
        list = list.filter(t => (t.WalletID || 'WLT-1') === wId);
      }

      if (this.reportPeriodType === 'month') {
        list = list.filter(t => {
          const d = this.parseDateString(t.Tanggal);
          return !isNaN(d.getTime()) && d.getMonth() === this.reportSelectedMonth && d.getFullYear() === this.reportSelectedYear;
        });
      } else if (this.reportPeriodType === 'year') {
        list = list.filter(t => {
          const d = this.parseDateString(t.Tanggal);
          return !isNaN(d.getTime()) && d.getFullYear() === this.reportSelectedYear;
        });
      }

      if (this.reportSearchQuery && this.reportSearchQuery.trim() !== '') {
        const q = this.reportSearchQuery.toLowerCase();
        list = list.filter(t => 
          (t.Deskripsi && t.Deskripsi.toLowerCase().includes(q)) ||
          (t.KasirUsername && t.KasirUsername.toLowerCase().includes(q))
        );
      }

      return list.sort((a, b) => this.parseDateString(b.Tanggal) - this.parseDateString(a.Tanggal));
    },

    get reportFilteredTransfers() {
      let list = this.allTransfers;

      const wId = this.reportEffectiveWalletId;
      if (wId !== 'ALL') {
        list = list.filter(tr => (tr.WalletID || 'WLT-1') === wId);
      }

      if (this.reportPeriodType === 'month') {
        list = list.filter(tr => {
          const d = this.parseDateString(tr.Tanggal);
          return !isNaN(d.getTime()) && d.getMonth() === this.reportSelectedMonth && d.getFullYear() === this.reportSelectedYear;
        });
      } else if (this.reportPeriodType === 'year') {
        list = list.filter(tr => {
          const d = this.parseDateString(tr.Tanggal);
          return !isNaN(d.getTime()) && d.getFullYear() === this.reportSelectedYear;
        });
      }

      return list.sort((a, b) => this.parseDateString(b.Tanggal) - this.parseDateString(a.Tanggal));
    },

    get reportAccounts() {
      const wId = this.reportEffectiveWalletId;
      if (wId !== 'ALL') {
        return this.allAccounts.filter(a => (a.WalletID || 'WLT-1') === wId && String(a.IsActive).toUpperCase() === 'TRUE');
      }
      return this.allAccounts.filter(a => String(a.IsActive).toUpperCase() === 'TRUE');
    },

    get reportTotalIncome() {
      return this.reportFilteredTransactions
        .filter(t => t.TipeTransaksi === 'PEMASUKAN')
        .reduce((sum, t) => sum + (Number(t.Nominal) || 0), 0);
    },

    get reportTotalExpense() {
      return this.reportFilteredTransactions
        .filter(t => t.TipeTransaksi === 'PENGELUARAN')
        .reduce((sum, t) => sum + (Number(t.Nominal) || 0), 0);
    },

    get reportNetSurplus() {
      return this.reportTotalIncome - this.reportTotalExpense;
    },

    // ===== CATATAN LABA BULANAN & KALKULASI OPERASIONAL =====
    get reportMonthlyProfitRecord() {
      const wId = this.reportEffectiveWalletId;
      if (this.reportPeriodType === 'month') {
        return this.monthlyProfits.find(p => 
          (wId === 'ALL' || p.walletId === wId || p.walletId === '*') &&
          p.month === this.reportSelectedMonth &&
          p.year === this.reportSelectedYear
        ) || null;
      }
      return null;
    },

    get reportTotalMonthlyProfitInput() {
      const wId = this.reportEffectiveWalletId;
      if (this.reportPeriodType === 'month') {
        const rec = this.reportMonthlyProfitRecord;
        return rec ? Number(rec.nominal) || 0 : 0;
      } else if (this.reportPeriodType === 'year') {
        return this.monthlyProfits
          .filter(p => (wId === 'ALL' || p.walletId === wId || p.walletId === '*') && p.year === this.reportSelectedYear)
          .reduce((sum, p) => sum + (Number(p.nominal) || 0), 0);
      } else {
        return this.monthlyProfits
          .filter(p => wId === 'ALL' || p.walletId === wId || p.walletId === '*')
          .reduce((sum, p) => sum + (Number(p.nominal) || 0), 0);
      }
    },

    get hasReportMonthlyProfit() {
      return this.reportTotalMonthlyProfitInput > 0;
    },

    // ===== PENGATURAN KATEGORI LAPORAN OPERASIONAL =====
    // Kategori pengeluaran yang tersedia untuk dompet yang sedang dilihat
    get reportAvailableExpenseCategories() {
      const wId = this.reportEffectiveWalletId;
      return this.allCategories.filter(c => 
        c.Tipe === 'PENGELUARAN' && 
        String(c.IsActive).toUpperCase() === 'TRUE' &&
        (wId === 'ALL' || c.WalletID === '*' || c.WalletID === wId)
      );
    },

    // Kategori standar yang direkomendasikan untuk beban operasional murni (Operasional, Gaji, Admin Bank, Sewa, Listrik)
    get defaultOperationalCategoryIds() {
      const keywords = ['operasional', 'gaji', 'admin', 'sewa', 'listrik', 'kantor', 'toko'];
      const matched = this.reportAvailableExpenseCategories.filter(cat => {
        const name = (cat.NamaKategori || '').toLowerCase();
        return keywords.some(k => name.includes(k));
      });
      if (matched.length > 0) {
        return matched.map(c => c.CategoryID);
      }
      return this.reportAvailableExpenseCategories.map(c => c.CategoryID);
    },

    // Kategori pengeluaran efektif yang dipilih pengguna untuk laporan operasional (mengecualikan Bagi Hasil)
    get effectiveReportOperationalCategoryIds() {
      const availableCats = this.reportAvailableExpenseCategories;
      const availableIds = availableCats.map(c => c.CategoryID);
      let selected = [];
      if (Array.isArray(this.reportSelectedCategoryIds) && this.reportSelectedCategoryIds.length > 0) {
        selected = this.reportSelectedCategoryIds.filter(id => {
          if (!availableIds.includes(id)) return false;
          const cat = this.allCategories.find(c => c.CategoryID === id);
          const name = (cat?.NamaKategori || '').toLowerCase();
          return !name.includes('bagi hasil') && !name.includes('dividen') && !name.includes('profit sharing');
        });
      }
      if (selected.length === 0) {
        selected = this.defaultOperationalCategoryIds.filter(id => {
          const cat = this.allCategories.find(c => c.CategoryID === id);
          const name = (cat?.NamaKategori || '').toLowerCase();
          return !name.includes('bagi hasil') && !name.includes('dividen') && !name.includes('profit sharing');
        });
      }

      // Pastikan kategori operasional baku (Operasional & Admin Bank) selalu otomatis tercantum memotong laba
      const sysOpsCats = availableCats.filter(c => {
        const n = (c.NamaKategori || '').toLowerCase();
        return (n === 'operasional' || n === 'admin bank' || n.includes('admin')) &&
               !n.includes('bagi hasil') && !n.includes('dividen') && !n.includes('profit sharing');
      });
      sysOpsCats.forEach(sc => {
        if (!selected.includes(sc.CategoryID)) {
          selected.push(sc.CategoryID);
        }
      });

      return selected;
    },

    // Transaksi pengeluaran yang secara spesifik merupakan Bagi Hasil / Dividen
    get reportExpenseBagiHasilTransactions() {
      const keywords = ['bagi hasil', 'dividen', 'profit sharing'];
      return this.reportFilteredTransactions.filter(t => {
        if (t.TipeTransaksi !== 'PENGELUARAN') return false;
        const cat = this.allCategories.find(c => c.CategoryID === t.CategoryID);
        const catName = (cat?.NamaKategori || '').toLowerCase();
        const desc = (t.Deskripsi || '').toLowerCase();
        return keywords.some(k => catName.includes(k) || desc.includes(k));
      });
    },

    // Total nominal pengeluaran bagi hasil dari riwayat transaksi
    get reportExpenseBagiHasilNominal() {
      return this.reportExpenseBagiHasilTransactions.reduce((sum, t) => sum + (Number(t.Nominal) || 0), 0);
    },

    // Status apakah nominal bagi hasil ditarik otomatis dari riwayat transaksi
    get isReportProfitSharingFromHistory() {
      const key = this.reportProfitSharingKey;
      const cfg = this.profitSharingConfig;
      if (cfg?.modeByPeriod && cfg.modeByPeriod[key] === 'manual') {
        return false;
      }
      return this.reportExpenseBagiHasilNominal > 0;
    },

    // Total pengeluaran KHUSUS dari kategori terpilih yang memotong laba
    // Mengecualikan transaksi bagi hasil agar tidak terpotong dua kali di Laba Bersih
    get reportOperationalTotalExpense() {
      const selectedCatIds = this.effectiveReportOperationalCategoryIds;
      const bagiHasilTxIds = this.reportExpenseBagiHasilTransactions.map(t => t.TransactionID);
      return this.reportFilteredTransactions
        .filter(t => t.TipeTransaksi === 'PENGELUARAN' && selectedCatIds.includes(t.CategoryID) && !bagiHasilTxIds.includes(t.TransactionID))
        .reduce((sum, t) => sum + (Number(t.Nominal) || 0), 0);
    },

    // Transaksi pengeluaran khusus dari kategori terpilih (murni operasional)
    get reportOperationalExpenseTransactions() {
      const selectedCatIds = this.effectiveReportOperationalCategoryIds;
      const bagiHasilTxIds = this.reportExpenseBagiHasilTransactions.map(t => t.TransactionID);
      return this.reportFilteredTransactions.filter(t => 
        t.TipeTransaksi === 'PENGELUARAN' && selectedCatIds.includes(t.CategoryID) && !bagiHasilTxIds.includes(t.TransactionID)
      );
    },

    // Transaksi pengeluaran khusus dari kategori terpilih dengan filter pencarian
    get reportOperationalFilteredTransactions() {
      let list = this.reportOperationalExpenseTransactions;
      if (this.reportSearchQuery && this.reportSearchQuery.trim() !== '') {
        const q = this.reportSearchQuery.toLowerCase();
        list = list.filter(t => 
          (t.Deskripsi && t.Deskripsi.toLowerCase().includes(q)) ||
          (t.KasirUsername && t.KasirUsername.toLowerCase().includes(q))
        );
      }
      return list;
    },

    // Laba Bersih Operasional = Laba (Diinput / Pemasukan) - Total Beban Kategori Terpilih
    get reportOperationalNetProfit() {
      const baseProfit = this.hasReportMonthlyProfit ? this.reportTotalMonthlyProfitInput : this.reportTotalIncome;
      return baseProfit - this.reportOperationalTotalExpense;
    },

    // Rasio Beban Kategori Terpilih terhadap Laba Masuk
    get reportOperationalExpenseRatio() {
      const base = this.hasReportMonthlyProfit ? this.reportTotalMonthlyProfitInput : this.reportTotalIncome;
      if (base <= 0) return this.reportOperationalTotalExpense > 0 ? 100 : 0;
      return Math.min(Math.round((this.reportOperationalTotalExpense / base) * 100), 100);
    },

    // Margin Laba Bersih Operasional
    get reportOperationalMargin() {
      const base = this.hasReportMonthlyProfit ? this.reportTotalMonthlyProfitInput : this.reportTotalIncome;
      if (base <= 0) return 0;
      return Math.round((this.reportOperationalNetProfit / base) * 100);
    },

    // ===== KALKULASI PENGGUNAAN LABA & BAGI HASIL =====
    get reportProfitSharingKey() {
      const wId = this.reportEffectiveWalletId;
      if (this.reportPeriodType === 'month') {
        return `${wId}_${this.reportSelectedYear}_${this.reportSelectedMonth}`;
      } else if (this.reportPeriodType === 'year') {
        return `${wId}_${this.reportSelectedYear}_ALL`;
      }
      return `${wId}_ALL_ALL`;
    },

    get reportProfitSharingNominal() {
      const cfg = this.profitSharingConfig;
      const key = this.reportProfitSharingKey;

      // 1. Jika mode manual dipilih secara eksplisit untuk periode ini
      if (cfg?.modeByPeriod && cfg.modeByPeriod[key] === 'manual') {
        return Number(cfg.periodNominals?.[key]) || 0;
      }

      // 2. Prioritas utama: Langsung ambil otomatis dari riwayat transaksi pengeluaran
      const expenseFromHistory = this.reportExpenseBagiHasilNominal;
      if (expenseFromHistory > 0) {
        return expenseFromHistory;
      }

      // 3. Jika belum ada transaksi di riwayat, gunakan setelan manual tersimpan untuk periode ini
      if (cfg?.periodNominals && cfg.periodNominals[key] !== undefined && cfg.periodNominals[key] !== null && cfg.periodNominals[key] !== '') {
        return Number(cfg.periodNominals[key]) || 0;
      }

      // 4. Fallback default
      return Number(cfg?.defaultNominal) || 0;
    },

    // Biaya Lain-Lain ditiadakan di Laporan Operasional (murni kategori terpilih)
    get reportProfitSharingOtherExpenses() {
      return 0;
    },

    // Total Sisa Laba = LABA BERSIH - Laba Bagi Hasil
    get reportRemainingProfit() {
      return this.reportOperationalNetProfit - this.reportProfitSharingNominal;
    },

    // Rincian Pembagian Laba per Pihak (% & Nominal Rp)
    get reportProfitSharingDistribution() {
      const total = this.reportProfitSharingNominal;
      const shares = (this.profitSharingConfig?.shares && this.profitSharingConfig.shares.length > 0)
        ? this.profitSharingConfig.shares
        : [
            { id: 'share-1', name: 'Pihak 1 (Pengelola)', percent: 60 },
            { id: 'share-2', name: 'Pihak 2 (Investor)', percent: 40 }
          ];

      return shares.map((s, idx) => {
        const pct = Number(s.percent) || 0;
        const nominal = Math.round((pct / 100) * total);
        return {
          no: idx + 1,
          id: s.id || `share-${idx}`,
          name: s.name || `Pihak ${idx + 1}`,
          percent: pct,
          nominal: nominal
        };
      });
    },

    get reportProfitSharingTotalPercent() {
      return (this.profitSharingConfig?.shares || []).reduce((sum, s) => sum + (Number(s.percent) || 0), 0);
    },

    // Nama file PDF dinamis sesuai Dompet, Jenis Laporan, dan Periode Bulan/Tahun
    get reportPdfFileName() {
      const type = this.reportType === 'operasional' ? 'Laporan_Operasional' : 'Laporan_Keuangan';
      const wName = (this.reportWalletName || 'Dompet')
        .replace(/\s+/g, '_')
        .replace(/[^a-zA-Z0-9_\-]/g, '');
      const pLabel = (this.reportPeriodLabel || '')
        .replace(/\s+/g, '_')
        .replace(/[^a-zA-Z0-9_\-]/g, '');
      return `${type}_${wName}_${pLabel}`;
    },

    // Rincian Breakdown Beban Kategori Terpilih (Murni Beban Operasional, Bukan Bagi Hasil)
    get reportOperationalCategoryBreakdown() {
      const selectedCatIds = this.effectiveReportOperationalCategoryIds;
      const bagiHasilTxIds = new Set(this.reportExpenseBagiHasilTransactions.map(t => t.TransactionID));
      const catsMap = {};
      const totalExp = this.reportOperationalTotalExpense;

      // Inisialisasi seluruh kategori yang dipilih agar tampil di rincian laporan
      selectedCatIds.forEach(id => {
        const cat = this.allCategories.find(c => c.CategoryID === id);
        const catName = (cat?.NamaKategori || '').toLowerCase();
        if (catName.includes('bagi hasil') || catName.includes('dividen') || catName.includes('profit sharing')) return;
        catsMap[id] = {
          categoryId: id,
          nama: cat ? cat.NamaKategori : id,
          tipe: 'PENGELUARAN',
          warna: cat ? cat.Warna : '#64748b',
          ikon: cat ? cat.Ikon : 'fa-receipt',
          total: 0,
          count: 0
        };
      });

      this.reportFilteredTransactions
        .filter(t => t.TipeTransaksi === 'PENGELUARAN' && selectedCatIds.includes(t.CategoryID) && !bagiHasilTxIds.has(t.TransactionID))
        .forEach(t => {
          const catId = t.CategoryID || 'UNKNOWN';
          const cat = this.allCategories.find(c => c.CategoryID === catId);
          const catName = (cat?.NamaKategori || '').toLowerCase();
          if (catName.includes('bagi hasil') || catName.includes('dividen') || catName.includes('profit sharing')) return;
          if (!catsMap[catId]) {
            catsMap[catId] = {
              categoryId: catId,
              nama: cat ? cat.NamaKategori : 'Pengeluaran Terpilih',
              tipe: 'PENGELUARAN',
              warna: cat ? cat.Warna : '#64748b',
              ikon: cat ? cat.Ikon : 'fa-receipt',
              total: 0,
              count: 0
            };
          }
          catsMap[catId].total += Number(t.Nominal) || 0;
          catsMap[catId].count += 1;
        });

      return Object.values(catsMap)
        .map(c => ({
          ...c,
          percent: totalExp > 0 ? Math.round((c.total / totalExp) * 100) : 0
        }))
        .filter(c => c.count > 0 || c.total > 0)
        .sort((a, b) => {
          if (b.total !== a.total) return b.total - a.total;
          return a.nama.localeCompare(b.nama);
        });
    },

    // Getters pembantu untuk lembar cetak & pratinjau dokumen resmi
    get printCategoryBreakdown() {
      if (this.reportType === 'operasional') {
        return this.reportOperationalCategoryBreakdown;
      }
      return this.reportCategoryBreakdown;
    },

    get printTransactions() {
      if (this.reportType === 'operasional') {
        return this.reportOperationalFilteredTransactions;
      }
      return this.reportFilteredTransactions;
    },

    get printTotalExpense() {
      if (this.reportType === 'operasional') {
        return this.reportOperationalTotalExpense;
      }
      return this.reportTotalExpense;
    },

    get reportTotalTransfers() {
      return this.reportFilteredTransfers
        .reduce((sum, tr) => sum + (Number(tr.Nominal) || 0), 0);
    },

    get reportTotalBalance() {
      return this.reportAccounts
        .reduce((sum, a) => sum + (Number(a.SaldoSekarang) || 0), 0);
    },

    get reportExpenseRatio() {
      if (this.reportTotalIncome <= 0) return this.reportTotalExpense > 0 ? 100 : 0;
      return Math.min(Math.round((this.reportTotalExpense / this.reportTotalIncome) * 100), 100);
    },

    get reportOperatingMargin() {
      if (this.reportTotalIncome <= 0) return 0;
      return Math.round((this.reportNetSurplus / this.reportTotalIncome) * 100);
    },

    get reportCategoryBreakdown() {
      const catsMap = {};
      const totalExp = this.reportTotalExpense;
      const totalInc = this.reportTotalIncome;

      this.reportFilteredTransactions.forEach(t => {
        const cat = this.allCategories.find(c => c.CategoryID === t.CategoryID);
        const catId = t.CategoryID || 'UNKNOWN';
        const catName = cat ? cat.NamaKategori : (t.TipeTransaksi === 'PEMASUKAN' ? 'Pemasukan Lain' : 'Pengeluaran Lain');
        const catType = t.TipeTransaksi;
        const catColor = cat ? cat.Warna : '#64748b';
        const catIcon = cat ? cat.Ikon : (catType === 'PEMASUKAN' ? 'fa-arrow-down' : 'fa-arrow-up');

        if (!catsMap[catId]) {
          catsMap[catId] = {
            categoryId: catId,
            nama: catName,
            tipe: catType,
            warna: catColor,
            ikon: catIcon,
            total: 0,
            count: 0
          };
        }
        catsMap[catId].total += Number(t.Nominal) || 0;
        catsMap[catId].count += 1;
      });

      const list = Object.values(catsMap);
      list.forEach(item => {
        const base = item.tipe === 'PENGELUARAN' ? totalExp : totalInc;
        item.percent = base > 0 ? Math.round((item.total / base) * 100) : 0;
      });

      return list.sort((a, b) => b.total - a.total);
    },

    get reportAccountBreakdown() {
      return this.reportAccounts.map(acc => {
        const accTxns = this.reportFilteredTransactions.filter(t => t.AccountID === acc.AccountID);
        const inFlow = accTxns.filter(t => t.TipeTransaksi === 'PEMASUKAN').reduce((s, t) => s + (Number(t.Nominal) || 0), 0);
        const outFlow = accTxns.filter(t => t.TipeTransaksi === 'PENGELUARAN').reduce((s, t) => s + (Number(t.Nominal) || 0), 0);
        
        const trIn = this.reportFilteredTransfers.filter(tr => tr.ToAccountID === acc.AccountID).reduce((s, tr) => s + (Number(tr.Nominal) || 0), 0);
        const trOut = this.reportFilteredTransfers.filter(tr => tr.FromAccountID === acc.AccountID).reduce((s, tr) => s + (Number(tr.TotalKeluar || tr.Nominal) || 0), 0);

        const totalMasuk = inFlow + trIn;
        const totalKeluar = outFlow + trOut;

        return {
          accountId: acc.AccountID,
          namaAkun: acc.NamaAkun,
          tipeAkun: acc.TipeAkun,
          ikon: acc.Ikon,
          warna: acc.Warna,
          saldoSekarang: Number(acc.SaldoSekarang) || 0,
          totalMasuk: totalMasuk,
          totalKeluar: totalKeluar,
          netFlow: totalMasuk - totalKeluar
        };
      });
    },

    // ================= GETTERS FINANSIAL (DOMPET AKTIF) =================
    get totalNetWorth() {
      return this.accounts
        .filter(a => String(a.IsActive).toUpperCase() === 'TRUE')
        .reduce((sum, a) => sum + (Number(a.SaldoSekarang) || 0), 0);
    },

    get selectedPeriodLabel() {
      if (this.isAllPeriod) {
        return 'Semua Waktu';
      }
      return `${this.monthNames[this.selectedMonth]} ${this.selectedYear}`;
    },

    get isCurrentMonthSelected() {
      const now = new Date();
      return !this.isAllPeriod && this.selectedMonth === now.getMonth() && this.selectedYear === now.getFullYear();
    },

    get periodHistoryCount() {
      let list = this.unifiedHistory;
      if (!this.isAllPeriod) {
        list = list.filter(item => this.isItemInSelectedPeriod(item.tanggal));
      }
      return list.length;
    },

    get periodTransferCount() {
      let list = this.transfers;
      if (!this.isAllPeriod) {
        list = list.filter(tr => this.isItemInSelectedPeriod(tr.Tanggal));
      }
      return list.length;
    },

    get currentMonthExpenses() {
      return this.transactions
        .filter(t => t.TipeTransaksi === 'PENGELUARAN' && this.isItemInSelectedPeriod(t.Tanggal))
        .reduce((sum, t) => sum + (Number(t.Nominal) || 0), 0);
    },

    get currentMonthIncome() {
      return this.transactions
        .filter(t => t.TipeTransaksi === 'PEMASUKAN' && this.isItemInSelectedPeriod(t.Tanggal))
        .reduce((sum, t) => sum + (Number(t.Nominal) || 0), 0);
    },

    get netCashflow() {
      return this.currentMonthIncome - this.currentMonthExpenses;
    },

    get totalMonthlyBudget() {
      return this.categories
        .filter(c => c.Tipe === 'PENGELUARAN' && String(c.IsActive).toUpperCase() === 'TRUE')
        .reduce((sum, c) => sum + (Number(c.BudgetBulanan) || 0), 0);
    },

    get remainingMonthlyBudget() {
      return this.totalMonthlyBudget - this.currentMonthExpenses;
    },

    get totalBudgetPercent() {
      if (this.totalMonthlyBudget <= 0) return 0;
      return Math.round((this.currentMonthExpenses / this.totalMonthlyBudget) * 100);
    },

    get totalTransferVolume() {
      return this.transfers.reduce((sum, tr) => sum + (Number(tr.Nominal) || 0), 0);
    },

    // Unified Timeline Transaksi & Transfer
    get unifiedHistory() {
      const list = [];

      this.transactions.forEach(t => {
        const acc = this.accounts.find(a => a.AccountID === t.AccountID);
        const cat = this.categories.find(c => c.CategoryID === t.CategoryID);
        list.push({
          id: t.TransactionID,
          itemType: 'TRANSACTION',
          tipe: t.TipeTransaksi,
          tanggal: this.formatDateDisplay(t.Tanggal),
          nominal: Number(t.Nominal) || 0,
          deskripsi: t.Deskripsi,
          accountName: acc ? acc.NamaAkun : 'Akun Tidak Dikenal',
          accountIcon: acc ? acc.Ikon : 'fa-wallet',
          accountColor: acc ? acc.Warna : '#64748b',
          categoryName: cat ? cat.NamaKategori : (t.TipeTransaksi === 'PEMASUKAN' ? 'Pemasukan' : 'Pengeluaran'),
          categoryIcon: cat ? cat.Ikon : (t.TipeTransaksi === 'PEMASUKAN' ? 'fa-arrow-down' : 'fa-arrow-up'),
          categoryColor: cat ? cat.Warna : '#10b981',
          kasirUsername: t.KasirUsername || 'superadmin',
          raw: t
        });
      });

      this.transfers.forEach(tr => {
        const fromAcc = this.accounts.find(a => a.AccountID === tr.FromAccountID);
        const toAcc = this.accounts.find(a => a.AccountID === tr.ToAccountID);
        list.push({
          id: tr.TransferID,
          itemType: 'TRANSFER',
          tipe: 'PINDAH_DANA',
          tanggal: this.formatDateDisplay(tr.Tanggal),
          nominal: Number(tr.Nominal) || 0,
          biayaAdmin: Number(tr.BiayaAdmin) || 0,
          deskripsi: tr.Catatan || 'Pindah Dana',
          accountName: `${fromAcc ? fromAcc.NamaAkun : '?'} → ${toAcc ? toAcc.NamaAkun : '?'}`,
          fromAccountName: fromAcc ? fromAcc.NamaAkun : 'Akun Asal',
          toAccountName: toAcc ? toAcc.NamaAkun : 'Akun Tujuan',
          accountIcon: 'fa-right-left',
          accountColor: '#0284c7',
          categoryName: 'Pindah Dana',
          categoryIcon: 'fa-arrows-rotate',
          categoryColor: '#0284c7',
          kasirUsername: tr.KasirUsername || 'superadmin',
          raw: tr
        });
      });

      return list.sort((a, b) => {
        const rawDateA = a.raw && a.raw.Tanggal ? this.parseDateString(a.raw.Tanggal) : this.parseDateString(a.tanggal);
        const rawDateB = b.raw && b.raw.Tanggal ? this.parseDateString(b.raw.Tanggal) : this.parseDateString(b.tanggal);
        const diff = rawDateB - rawDateA;
        if (diff !== 0) return diff;
        return String(b.id || '').localeCompare(String(a.id || ''));
      });
    },

    get filteredHistory() {
      let result = this.unifiedHistory;

      if (!this.isAllPeriod) {
        result = result.filter(item => this.isItemInSelectedPeriod(item.tanggal));
      }

      if (this.filterType) {
        result = result.filter(item => item.tipe === this.filterType);
      }

      if (this.filterAccount) {
        result = result.filter(item => {
          if (item.itemType === 'TRANSACTION') {
            return item.raw.AccountID === this.filterAccount;
          }
          if (item.itemType === 'TRANSFER') {
            return item.raw.FromAccountID === this.filterAccount || item.raw.ToAccountID === this.filterAccount;
          }
          return true;
        });
      }

      if (this.filterCategory) {
        result = result.filter(item => item.itemType === 'TRANSACTION' && item.raw.CategoryID === this.filterCategory);
      }

      if (this.searchQuery && this.searchQuery.trim() !== '') {
        const q = this.searchQuery.toLowerCase();
        result = result.filter(item => 
          item.deskripsi.toLowerCase().includes(q) ||
          item.accountName.toLowerCase().includes(q) ||
          item.categoryName.toLowerCase().includes(q) ||
          (item.kasirUsername && item.kasirUsername.toLowerCase().includes(q))
        );
      }

      return result;
    },

    get categoryBreakdown() {
      const expenses = this.transactions.filter(t => 
        t.TipeTransaksi === 'PENGELUARAN' && this.isItemInSelectedPeriod(t.Tanggal)
      );
      const catMap = {};

      expenses.forEach(t => {
        const catId = t.CategoryID || 'OTHER';
        catMap[catId] = (catMap[catId] || 0) + Number(t.Nominal);
      });

      return this.categories
        .filter(c => c.Tipe === 'PENGELUARAN')
        .map(c => {
          const spent = catMap[c.CategoryID] || 0;
          const budget = Number(c.BudgetBulanan) || 0;
          const percent = budget > 0 ? Math.min(Math.round((spent / budget) * 100), 100) : 0;
          const isOver = budget > 0 && spent > budget;
          return {
            ...c,
            spent,
            budget,
            percent,
            isOver
          };
        })
        .sort((a, b) => b.spent - a.spent);
    },

    get filteredCategories() {
      if (!this.categoryFilterType || this.categoryFilterType === 'ALL') {
        return this.categories;
      }
      return this.categories.filter(c => c.Tipe === this.categoryFilterType);
    },

    // ================= MULTI-DOMPET (WALLET) ACTIONS =================
    openAddWalletModal() {
      if (!this.canCreateWallet) {
        Swal.fire({
          icon: 'warning',
          title: 'Akses Dibatasi',
          text: 'Hanya Super Administrator yang memiliki hak akses untuk membuat dompet baru.'
        });
        return;
      }
      this.walletForm = {
        WalletID: '',
        NamaDompet: '',
        Deskripsi: '',
        Ikon: 'fa-wallet',
        Warna: '#059669',
        initDefaults: true
      };
      this.showWalletModal = true;
    },

    openEditWalletModal(wallet) {
      if (!this.canAccessWallet(wallet.WalletID)) {
        Swal.fire({
          icon: 'warning',
          title: 'Akses Dibatasi',
          text: 'Anda tidak memiliki hak akses untuk mengedit dompet ini.'
        });
        return;
      }
      this.walletForm = {
        WalletID: wallet.WalletID,
        NamaDompet: wallet.NamaDompet,
        Deskripsi: wallet.Deskripsi || '',
        Ikon: wallet.Ikon || 'fa-wallet',
        Warna: wallet.Warna || '#059669',
        initDefaults: false
      };
      this.showWalletModal = true;
    },

    async submitWallet() {
      if (!this.walletForm.NamaDompet.trim()) {
        Swal.fire({ icon: 'warning', title: 'Nama Dompet Wajib Diisi' });
        return;
      }

      const isEdit = !!this.walletForm.WalletID;
      if (!isEdit && !this.canCreateWallet) {
        Swal.fire({
          icon: 'error',
          title: 'Akses Ditolak',
          text: 'Hanya Super Administrator yang dapat membuat dompet baru.'
        });
        return;
      }

      this.isLoading = true;
      const walletId = this.walletForm.WalletID || ('WLT-' + new Date().getTime());

      const payload = {
        WalletID: walletId,
        NamaDompet: this.walletForm.NamaDompet.trim(),
        Deskripsi: this.walletForm.Deskripsi.trim(),
        Ikon: this.walletForm.Ikon || 'fa-wallet',
        Warna: this.walletForm.Warna || '#059669',
        OwnerUserID: this.currentUser ? this.currentUser.Username : 'user',
        IsActive: 'TRUE',
        CreatedAt: this.formatDateInput(new Date()).split(' ')[0],
        initDefaults: this.walletForm.initDefaults
      };

      if (isEdit) {
        const idx = this.wallets.findIndex(w => w.WalletID === walletId);
        if (idx !== -1) {
          this.wallets[idx] = { ...this.wallets[idx], ...payload };
        }
      } else {
        this.wallets.push(payload);

        // Jika dompet baru dibuat oleh user non-superadmin, tambahkan ke AssignedWallets pengguna aktif
        if (this.currentUser && this.currentUser.AssignedWallets !== '*') {
          let assigned = (this.currentUser.AssignedWallets || '').split(',').map(s => s.trim()).filter(Boolean);
          if (!assigned.includes(walletId)) {
            assigned.push(walletId);
            this.currentUser.AssignedWallets = assigned.join(',');
            const uIdx = this.users.findIndex(u => u.UserID === this.currentUser.UserID);
            if (uIdx !== -1) {
              this.users[uIdx].AssignedWallets = this.currentUser.AssignedWallets;
            }
            localStorage.setItem(USER_KEY, JSON.stringify(this.currentUser));
          }
        }

        // Jika buat baru dan centang inisialisasi akun & kategori default
        if (this.walletForm.initDefaults) {
          const accTunai = {
            AccountID: 'ACC-' + walletId + '-1',
            WalletID: walletId,
            NamaAkun: 'Kas Tunai ' + payload.NamaDompet,
            TipeAkun: 'TUNAI',
            NomorAkun: 'Uang Fisik',
            SaldoAwal: 0,
            SaldoSekarang: 0,
            Warna: payload.Warna,
            Ikon: 'fa-wallet',
            IsActive: 'TRUE'
          };
          const accBank = {
            AccountID: 'ACC-' + walletId + '-2',
            WalletID: walletId,
            NamaAkun: 'Rekening Bank ' + payload.NamaDompet,
            TipeAkun: 'BANK',
            NomorAkun: '-',
            SaldoAwal: 0,
            SaldoSekarang: 0,
            Warna: '#2563eb',
            Ikon: 'fa-building-columns',
            IsActive: 'TRUE'
          };
          this.allAccounts.push(accTunai, accBank);

          // Buat kategori baku sistem khusus dompet ini
          const catPemasukan = {
            CategoryID: 'CAT-' + walletId + '-IN1',
            WalletID: walletId,
            NamaKategori: 'Pemasukan ' + payload.NamaDompet,
            Tipe: 'PEMASUKAN',
            Ikon: 'fa-money-bill-wave',
            Warna: '#10b981',
            BudgetBulanan: 0,
            Urutan: 1,
            IsActive: 'TRUE'
          };
          const catOperasional = {
            CategoryID: 'CAT-' + walletId + '-SYS-OPS',
            WalletID: walletId,
            NamaKategori: 'Operasional',
            Tipe: 'PENGELUARAN',
            Ikon: 'fa-briefcase',
            Warna: '#0284c7',
            BudgetBulanan: 1000000,
            Urutan: 2,
            IsActive: 'TRUE',
            IsSystem: 'TRUE'
          };
          const catBagiHasil = {
            CategoryID: 'CAT-' + walletId + '-SYS-BGH',
            WalletID: walletId,
            NamaKategori: 'Bagi Hasil',
            Tipe: 'PENGELUARAN',
            Ikon: 'fa-hand-holding-dollar',
            Warna: '#0d9488',
            BudgetBulanan: 1000000,
            Urutan: 3,
            IsActive: 'TRUE',
            IsSystem: 'TRUE'
          };
          const catAdminBank = {
            CategoryID: 'CAT-' + walletId + '-SYS-ADM',
            WalletID: walletId,
            NamaKategori: 'Admin Bank',
            Tipe: 'PENGELUARAN',
            Ikon: 'fa-receipt',
            Warna: '#64748b',
            BudgetBulanan: 100000,
            Urutan: 4,
            IsActive: 'TRUE',
            IsSystem: 'TRUE'
          };
          this.allCategories.push(catPemasukan, catOperasional, catBagiHasil, catAdminBank);
        }
      }

      this.saveLocalData();

      try {
        await runApi('saveWallet', [payload, this.currentUser ? this.currentUser.Role : 'user']);
      } catch (e) {
        console.warn('Sync wallet ke cloud gagal/offline:', e);
      }

      this.isLoading = false;
      this.showWalletModal = false;

      // Otomatis beralih ke dompet baru
      if (!isEdit) {
        this.switchWallet(walletId);
      } else {
        this.refreshActiveWalletData();
      }

      Swal.fire({
        icon: 'success',
        title: isEdit ? 'Dompet Diperbarui!' : 'Dompet Baru Dibuat!',
        text: `Dompet "${payload.NamaDompet}" siap digunakan dengan data terpisah.`,
        timer: 1800,
        showConfirmButton: false
      });
    },

    async deleteWalletItem(wallet) {
      if (!this.canDeleteWallet) {
        Swal.fire({
          icon: 'error',
          title: 'Akses Ditolak',
          text: 'Peran Pengguna (User) tidak memiliki izin untuk menghapus dompet. Anda hanya dapat menambah atau mengedit dompet.'
        });
        return;
      }

      if (this.wallets.length <= 1) {
        Swal.fire({
          icon: 'warning',
          title: 'Tidak Bisa Dihapus',
          text: 'Minimal harus ada 1 dompet aktif di aplikasi DompetKu.'
        });
        return;
      }

      const confirm = await Swal.fire({
        title: `Hapus Dompet "${wallet.NamaDompet}"?`,
        text: `Seluruh akun keuangan, riwayat transaksi, dan catatan pindah dana di dalam dompet ini akan ikut terhapus permanen!`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Ya, Hapus Dompet Ini',
        cancelButtonText: 'Batal'
      });

      if (!confirm.isConfirmed) return;

      this.isLoading = true;

      // Hapus data yang terikat dengan dompet ini
      this.wallets = this.wallets.filter(w => w.WalletID !== wallet.WalletID);
      this.allAccounts = this.allAccounts.filter(a => a.WalletID !== wallet.WalletID);
      this.allTransactions = this.allTransactions.filter(t => t.WalletID !== wallet.WalletID);
      this.allTransfers = this.allTransfers.filter(tr => tr.WalletID !== wallet.WalletID);
      this.allCategories = this.allCategories.filter(c => c.WalletID !== wallet.WalletID);

      // Jika dompet yang dihapus sedang aktif, pindah ke dompet lain
      if (this.activeWalletId === wallet.WalletID) {
        this.activeWalletId = this.wallets[0].WalletID;
        localStorage.setItem(ACTIVE_WALLET_KEY, this.activeWalletId);
      }

      this.refreshActiveWalletData();
      this.saveLocalData();

      try {
        await runApi('deleteWallet', [wallet.WalletID, this.currentUser ? this.currentUser.Role : 'user']);
      } catch (e) {}

      this.isLoading = false;

      Swal.fire({
        icon: 'success',
        title: 'Dompet Berhasil Dihapus',
        text: 'Data telah dibersihkan dan otomatis beralih ke dompet aktif lainnya.',
        timer: 1600,
        showConfirmButton: false
      });
    },

    openAddUserModal() {

      this.userForm = {
        UserID: '',
        Username: '',
        FullName: '',
        Password: '',
        Role: 'user',
        Pin: '123456',
        IsActive: 'TRUE',
        authMode: 'custom', // 'all' (Akses Semua) | 'custom' (Pilih Dompet)

      };
      this.showUserModal = true;
    },

    openEditUserModal(user) {
      const assigned = (!user.AssignedWallets || user.AssignedWallets === '*')
        ? ['*']
        : user.AssignedWallets.split(',').map(s => s.trim()).filter(Boolean);

      const isAll = assigned.includes('*') || user.Role === 'superadmin';

      this.userForm = {
        UserID: user.UserID,
        Username: user.Username,
        FullName: user.FullName,
        Password: '', // opsional ganti password
        Role: user.Role || 'user',
        Pin: user.Pin || '123456',
        IsActive: user.IsActive || 'TRUE',
        authMode: isAll ? 'all' : 'custom',
        AssignedWallets: isAll ? ['*'] : assigned
      };
      this.showUserModal = true;
    },

    setAuthMode(mode) {
      this.userForm.authMode = mode;
      if (mode === 'all') {
        this.userForm.AssignedWallets = ['*'];
      } else {
        const currentCustom = (this.userForm.AssignedWallets || []).filter(id => id !== '*');
        if (currentCustom.length > 0) {
          this.userForm.AssignedWallets = currentCustom;
        } else {
          const def = this.activeWalletId || (this.wallets.length > 0 ? this.wallets[0].WalletID : '');
          this.userForm.AssignedWallets = def ? [def] : [];
        }
      }
    },

    toggleWalletAssignment(wId) {
      if (this.userForm.authMode === 'all') {
        this.userForm.authMode = 'custom';
      }
      let current = (this.userForm.AssignedWallets || []).filter(id => id !== '*');
      if (current.includes(wId)) {
        current = current.filter(id => id !== wId);
      } else {
        current.push(wId);
      }
      this.userForm.AssignedWallets = current;
    },

    async submitUser() {
      if (!this.userForm.Username.trim()) {
        Swal.fire({ icon: 'warning', title: 'Username Wajib Diisi' });
        return;
      }
      if (!this.userForm.FullName.trim()) {
        Swal.fire({ icon: 'warning', title: 'Nama Lengkap Wajib Diisi' });
        return;
      }

      const isEdit = !!this.userForm.UserID;
      const cleanUser = this.userForm.Username.trim().toLowerCase();

      // Cek duplikasi username
      const dup = this.users.find(u => u.Username.toLowerCase() === cleanUser && u.UserID !== this.userForm.UserID);
      if (dup) {
        Swal.fire({ icon: 'error', title: 'Username Sudah Dipakai', text: `Username "${this.userForm.Username}" sudah digunakan oleh pengguna lain.` });
        return;
      }

      if (!isEdit && !this.userForm.Password) {
        Swal.fire({ icon: 'warning', title: 'Password Wajib Diisi', text: 'Masukkan password awal untuk pengguna baru.' });
        return;
      }

      // Pastikan otorisasi dompet valid
      if (this.userForm.Role === 'superadmin') {
        this.userForm.authMode = 'all';
        this.userForm.AssignedWallets = ['*'];
      }

      let assignedWallets = [...(this.userForm.AssignedWallets || [])];
      if (this.userForm.authMode === 'all' || assignedWallets.includes('*')) {
        assignedWallets = ['*'];
      } else {
        assignedWallets = assignedWallets.filter(id => id !== '*');
        if (assignedWallets.length === 0) {
          Swal.fire({
            icon: 'warning',
            title: 'Pilih Dompet',
            text: 'Tentukan minimal 1 dompet yang dapat diakses oleh pengguna ini.'
          });
          return;
        }
      }

      this.isLoading = true;
      const userId = this.userForm.UserID || ('USR-' + new Date().getTime());
      const assignedStr = assignedWallets.includes('*') ? '*' : assignedWallets.join(',');

      const payload = {
        UserID: userId,
        Username: cleanUser,
        FullName: this.userForm.FullName.trim(),
        Role: this.userForm.Role,
        Pin: this.userForm.Pin || '123456',
        IsActive: this.userForm.IsActive || 'TRUE',
        AssignedWallets: assignedStr
      };

      if (this.userForm.Password) {
        payload.Password = this.userForm.Password;
      }

      if (isEdit) {
        const idx = this.users.findIndex(u => u.UserID === userId);
        if (idx !== -1) {
          this.users[idx] = { ...this.users[idx], ...payload };
        }
        // Jika sedang mengedit user yang sedang login
        if (this.currentUser.UserID === userId) {
          this.currentUser = { ...this.currentUser, ...payload };
          localStorage.setItem(USER_KEY, JSON.stringify(this.currentUser));
        }
      } else {
        this.users.push(payload);
      }

      this.saveLocalData();

      try {
        await runApi('saveUser', [payload]);
      } catch (e) {
        console.warn('Sync user ke cloud gagal/offline:', e);
      }

      this.isLoading = false;
      this.showUserModal = false;

      Swal.fire({
        icon: 'success',
        title: isEdit ? 'Pengguna Diperbarui!' : 'Pengguna Baru Ditambahkan!',
        text: `Akun @${payload.Username} dengan peran ${payload.Role.toUpperCase()} berhasil disimpan.`,
        timer: 1800,
        showConfirmButton: false
      });
    },

    // PROSES LOGIN
    async handleLogin() {
      const username = (this.loginForm.username || '').trim();
      const password = (this.loginForm.password || '').trim();

      if (!username || !password) {
        this.loginForm.errorMessage = 'Username dan password wajib diisi';
        return;
      }

      this.loginForm.loading = true;
      this.loginForm.errorMessage = '';

      try {
        let authUser = null;

        // 1. Coba verifikasi lewat API Apps Script jika terhubung
        try {
          const res = await runApi('doLogin', [username, password]);
          if (res && res.success && res.data) {
            authUser = {
              UserID: res.data.userId || res.data.UserID,
              Username: res.data.username || res.data.Username,
              Role: res.data.role || res.data.Role,
              FullName: res.data.fullName || res.data.FullName,
              AssignedWallets: res.data.assignedWallets || res.data.AssignedWallets || '*'
            };
          } else if (res && res.success === false) {
            this.loginForm.errorMessage = res.message || 'Username atau password salah';
          }
        } catch (apiErr) {
          console.warn('API login offline / fallback ke local:', apiErr);
        }

        // 2. Jika offline / backend belum return user, verifikasi dari data users lokal
        if (!authUser && !this.loginForm.errorMessage) {
          const found = this.users.find(u =>
            String(u.Username).toLowerCase() === username.toLowerCase() &&
            (String(u.Password) === password || (!u.Password && (password === 'admin123' || password === 'toko123' || password === 'kasir123'))) &&
            String(u.IsActive).toUpperCase() === 'TRUE'
          );

          if (found) {
            authUser = { ...found };
          } else if ((username.toLowerCase() === 'superadmin' || username.toLowerCase() === 'admin') && password === 'admin123') {
            authUser = {
              UserID: 'USR-1',
              Username: 'superadmin',
              Role: 'superadmin',
              FullName: 'Super Administrator',
              AssignedWallets: '*'
            };
          } else if ((username.toLowerCase() === 'manajer_toko' || username.toLowerCase() === 'toko') && (password === 'toko123' || password === 'admin123')) {
            authUser = {
              UserID: 'USR-2',
              Username: 'manajer_toko',
              Role: 'admin',
              FullName: 'Manajer Toko',
              AssignedWallets: 'WLT-2'
            };
          } else if ((username.toLowerCase() === 'kasir' || username.toLowerCase() === 'kasir_toko') && (password === 'kasir123' || password === 'toko123')) {
            authUser = {
              UserID: 'USR-4',
              Username: 'kasir_toko',
              Role: 'user',
              FullName: 'Kasir Toko',
              AssignedWallets: 'WLT-2'
            };
          } else if (username.toLowerCase() === 'kasir_pribadi' && password === 'kasir123') {
            authUser = {
              UserID: 'USR-3',
              Username: 'kasir_pribadi',
              Role: 'user',
              FullName: 'Kasir Pribadi',
              AssignedWallets: 'WLT-1'
            };
          }
        }

        if (!authUser) {
          if (!this.loginForm.errorMessage) {
            this.loginForm.errorMessage = 'Username atau password tidak cocok!';
          }
          this.loginForm.loading = false;
          return;
        }

        // Login Berhasil!
        this.currentUser = authUser;
        this.isLoggedIn = true;
        localStorage.setItem(USER_KEY, JSON.stringify(this.currentUser));
        localStorage.setItem('DOMPETKU_LOGGED_IN', 'true');

        // Pastikan dompet aktif otomatis sesuai hak akses user
        if (!this.canAccessWallet(this.activeWalletId)) {
          const allowed = this.userAccessibleWallets;
          if (allowed.length > 0) {
            this.activeWalletId = allowed[0].WalletID;
            localStorage.setItem(ACTIVE_WALLET_KEY, this.activeWalletId);
          }
        }
        if (!this.isSuperAdmin && (this.activeTab === 'users' || this.activeTab === 'backup')) {
          this.activeTab = 'dashboard';
        }
        this.refreshActiveWalletData();
        this.syncReportFiltersWithActive();

        this.loginForm.password = '';
        this.loginForm.loading = false;

        const roleBadgeClass = this.currentUser.Role === 'superadmin' 
          ? 'bg-purple-100 text-purple-700 dark:bg-purple-950/80 dark:text-purple-300 border-purple-200 dark:border-purple-800' 
          : (this.currentUser.Role === 'admin' 
              ? 'bg-blue-100 text-blue-700 dark:bg-blue-950/80 dark:text-blue-300 border-blue-200 dark:border-blue-800' 
              : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800');

        const activeWalletObj = this.wallets.find(w => w.WalletID === this.activeWalletId) || this.wallets[0];
        const activeWalletName = activeWalletObj ? activeWalletObj.NamaDompet : 'Dompet Utama';

              <div class="relative mx-auto w-16 h-16 flex items-center justify-center">
                <div class="absolute inset-0 rounded-2xl bg-emerald-500/20 blur-xl"></div>
                <div class="relative w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/30">
                  <i class="fa-solid fa-circle-check"></i>
                </div>
              </div>
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 block">Autentikasi Berhasil</span>
                <h3 class="text-xl font-extrabold text-slate-900 dark:text-white mt-0.5">Selamat Datang! 👋</h3>

          customClass: {
            popup: 'rounded-3xl p-3 shadow-2xl border border-slate-200/90 dark:border-slate-800/90 backdrop-blur-2xl'
          }

      } catch (e) {

      } else {

      }

        this.selectedYear = year;
        this.tempPickerYear = year;
      }
      this.isAllPeriod = false;

      this.showMonthPickerModal = false;
